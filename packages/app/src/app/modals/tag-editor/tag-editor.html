<div class="modal-header">
  <h5 class="modal-title">{{ 'components.modals.tag-editor.title' | translate }}</h5>
  <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <div class="form-floating">
    <input
      type="text"
      id="tagEditorName"
      class="form-control"
      [formControl]="nameControl"
      placeholder="{{ 'components.modals.tag-editor.name-placeholder' | translate }}"
      (keydown.enter)="save()"
    />
    <label for="tagEditorName">{{ 'components.modals.tag-editor.name-label' | translate }}</label>
  </div>
  <div class="form-text mt-1">
    {{ 'components.modals.tag-editor.hint' | translate }}
  </div>
</div>
<div class="modal-footer">
  <button
    type="button"
    class="btn btn-primary btn-sm btn-split"
    [disabled]="!nameControl.value.trim()"
    (click)="save()"
  >
    <bb-btn-content
      [icon]="icon.faPlus"
      [text]="'general.button.add' | translate"
      position="end"
    ></bb-btn-content>
  </button>
  <button type="button" class="btn btn-sm btn-split" (click)="activeModal.dismiss()">
    <bb-btn-content
      [icon]="icon.faXmark"
      [text]="'general.button.cancel' | translate"
      position="end"
    ></bb-btn-content>
  </button>
</div>
