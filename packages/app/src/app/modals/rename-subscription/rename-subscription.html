<div class="modal-header bb-modal-header">
  <div class="bb-modal-header__text">
    <h5 class="modal-title bb-title-clamp">{{ 'pages.rss.modal.rename.title' | translate }}</h5>
  </div>

  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>
<div class="modal-body">
  <form [formGroup]="form" (submit)="handleSubmit()">
    <div class="container-fluid">
      <div class="row g-3">
        <div class="col-12">
          <div class="form-floating">
            <input
              type="text"
              class="form-control"
              id="rss-feed-rename"
              placeholder="Name"
              formControlName="name"
              autofocus
            />
            <label for="rss-feed-rename">{{ 'pages.rss.modal.rename.name' | translate }}</label>
          </div>
        </div>
      </div>
    </div>
    <button type="submit" hidden [disabled]="!canSave()"></button>
  </form>
</div>
<div class="modal-footer">
  <button
    type="button"
    class="btn btn-primary btn-sm btn-split"
    (click)="handleSubmit()"
    [disabled]="!canSave()"
  >
    <bb-btn-content
      [icon]="icons.faFloppyDisk"
      [text]="'general.button.save' | translate"
      position="end"
    ></bb-btn-content>
  </button>
  <button type="button" class="btn btn-sm btn-split" (click)="activeModal.dismiss()">
    <bb-btn-content
      [icon]="icons.faXmark"
      [text]="'general.button.cancel' | translate"
      position="end"
    ></bb-btn-content>
  </button>
</div>
