<div class="modal-header">
  <h4 class="modal-title">{{ title() | translate: titleParams() }}</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>
<div class="modal-body" [innerHTML]="message() | translate: messageParams()"></div>
<div class="modal-footer">
  <button
    type="button"
    class="btn btn-danger btn-sm btn-split"
    (click)="activeModal.close(true)"
    autofocus
  >
    <bb-btn-content
      [icon]="okIcon()"
      [text]="btnOkText() | translate"
      position="end"
    ></bb-btn-content>
  </button>
  <button type="button" class="btn btn-sm btn-split" (click)="activeModal.close(false)">
    <bb-btn-content
      [icon]="cancelIcon()"
      [text]="btnCancelText() | translate"
      position="end"
    ></bb-btn-content>
  </button>
</div>
