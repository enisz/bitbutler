<div [formGroup]="form()">
  <div class="container px-0">
    <div class="row">
      <div class="col-12 mb-3">
        <div class="bb-fieldset my-0">
          <div class="bb-fieldset-title">
            {{ 'components.add-torrent.label.transfer-rate-limits' | translate }}
          </div>
          <app-transfer-limit formControlName="transferRateLimits"></app-transfer-limit>
        </div>
      </div>

      <div class="col-12">
        <div class="bb-fieldset my-0">
          <div class="bb-fieldset-title">
            {{ 'components.add-torrent.label.share-limits' | translate }}
          </div>
          <app-share-limit formControlName="shareLimits"></app-share-limit>
        </div>
      </div>
    </div>
  </div>
</div>
