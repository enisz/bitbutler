<div class="modal-header">
  <h5 class="modal-title">{{ 'components.modals.manage-servers.title' | translate }}</h5>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body">
  <ag-grid-angular
    class="w-100 d-block bb-manage-servers-grid"
    (gridReady)="onGridReady($event)"
    [loading]="loading()"
    [rowData]="servers()"
    [columnDefs]="colDefs()"
    [gridOptions]="gridOptions"
    [theme]="theme() === 'dark' ? bbDark : bbLight"
  />
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary btn-sm" (click)="openNew()">
    {{ 'general.button.new' | translate }}
  </button>
  <button
    type="button"
    class="btn btn-secondary btn-sm"
    [disabled]="!canEdit()"
    (click)="openEdit()"
  >
    {{ 'general.button.edit' | translate }}
  </button>
  @if (!hideConnect()) {
    <button
      type="button"
      class="btn btn-secondary btn-sm"
      [disabled]="!canConnect()"
      (click)="connectSelected()"
    >
      {{ 'general.button.connect' | translate }}
    </button>
  }
  <button
    type="button"
    class="btn btn-danger btn-sm"
    [disabled]="!canDelete()"
    (click)="deleteSelected()"
  >
    {{ 'general.button.delete' | translate }}
  </button>
  <button type="button" class="btn btn-secondary btn-sm ms-auto" (click)="activeModal.close()">
    {{ 'general.button.close' | translate }}
  </button>
</div>
