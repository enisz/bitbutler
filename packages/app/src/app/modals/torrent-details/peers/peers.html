@if (isPhone()) {
  <app-peers-list [peers]="peers" [loading]="loading" />
} @else {
  <ag-grid-angular
    class="w-100"
    style="height: 600px"
    (gridReady)="onGridReady($event)"
    [loading]="loading"
    [rowData]="peers"
    [columnDefs]="colDefs"
    [gridOptions]="gridOptions"
    [theme]="theme() === 'dark' ? bbDark : bbLight"
  />
}
