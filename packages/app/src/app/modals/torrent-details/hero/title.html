@if (torrent(); as t) {
  <div class="bb-title-row">
    <h1
      class="bb-title-row__name bb-title-clamp"
      [ngbTooltip]="t.data.name"
      bbTooltipOverflow
      placement="bottom"
      tooltipClass="single-line-tooltip"
    >
      {{ t.data.name }}
    </h1>
  </div>
  <div class="bb-title-row__meta">
    @if (infoHash(); as hash) {
      <span class="bb-title-row__hash">
        <code>{{ hash }}</code>
        <button
          type="button"
          class="bb-title-row__hash-copy"
          [ngbTooltip]="'pages.main.grid.context-menu.item.copy-info-hash' | translate"
          (click)="copyInfoHash()"
        >
          <fa-icon [icon]="icon.faCopy" aria-hidden="true"></fa-icon>
        </button>
      </span>
      <span>&middot;</span>
    }
    <span>{{ t.data.total_size | fileSize }}</span>
    <span>&middot;</span>
    <span>{{
      'components.modals.torrent-details.hero.added'
        | translate: { time: t.data.added_on * 1000 | timeago }
    }}</span>
  </div>
}
