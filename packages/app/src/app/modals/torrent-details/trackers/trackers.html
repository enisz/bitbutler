<div class="bb-grid-toolbar">
  <span>{{
    'components.modals.torrent-details.trackers.toolbar.count'
      | translate: { count: trackers.length }
  }}</span>
</div>
<ag-grid-angular
  class="w-100 bb-td-grid"
  style="height: 600px"
  (gridReady)="onGridReady($event)"
  [loading]="loading"
  [rowData]="trackers"
  [columnDefs]="colDefs"
  [gridOptions]="gridOptions"
  [theme]="theme() === 'dark' ? bbDark : bbLight"
/>
