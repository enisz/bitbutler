<div class="modal-header bb-modal-header">
  <div class="bb-modal-header__text">
    <h5 class="modal-title bb-title-clamp">
      {{ 'components.modals.set-torrent-tags.title' | translate }}
    </h5>

    <div
      #element
      class="small text-body-secondary mt-1 bb-hash-clamp"
      [ngbTooltip]="selected() === 1 ? torrent().name : null"
      bbTooltipOverflow
      placement="bottom"
      tooltipClass="single-line-tooltip"
    >
      @if (selected() > 1) {
        {{ 'general.label.torrent-selected' | translate: { count: selected() } }}
      } @else {
        {{ torrent().name }}
      }
    </div>
  </div>

  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>
<div class="modal-body">
  <form [formGroup]="setTorrentTagsForm" (submit)="handleSubmit()">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <app-tag-select formControlName="tags" [autofocus]="true"></app-tag-select>
        </div>
      </div>
    </div>
    <button type="submit" hidden [disabled]="!canSave()"></button>
  </form>
</div>
<div class="modal-footer">
  <button
    type="button"
    class="btn btn-primary btn-sm btn-split"
    (click)="handleSubmit()"
    [disabled]="!canSave()"
  >
    <bb-btn-content
      [icon]="icons.faFloppyDisk"
      [text]="'general.button.save' | translate"
      position="end"
    ></bb-btn-content>
  </button>
  @if (hasClearableValue()) {
    <button
      type="button"
      class="btn btn-dashed-danger btn-sm btn-split"
      (click)="clear()"
      [disabled]="saving()"
    >
      <bb-btn-content
        [icon]="icons.faEraser"
        [text]="'general.button.clear' | translate"
        position="end"
      ></bb-btn-content>
    </button>
  }
  <button type="button" class="btn btn-link btn-sm btn-split" (click)="activeModal.close()">
    <bb-btn-content
      [icon]="icons.faXmark"
      [text]="'general.button.cancel' | translate"
      position="end"
    ></bb-btn-content>
  </button>
</div>
