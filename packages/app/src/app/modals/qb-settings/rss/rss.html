<form [formGroup]="form">
  <div class="container-fluid">
    <div class="row mb-3">
      <div class="col-12">{{ 'pages.qb-settings.tab.rss.description' | translate }}</div>
    </div>
    <fieldset class="bb-fieldset">
      <legend>{{ 'pages.qb-settings.tab.rss.label.fetching' | translate }}</legend>
      <div class="container mt-3">
        <div class="bb-options mb-3">
          <div class="bb-option">
            <div class="bb-option__text">
              <label class="bb-option__label" for="rss-processing-enabled">
                {{ 'pages.qb-settings.tab.rss.field.processing-enabled' | translate }}
              </label>
            </div>
            <span class="bb-option__toggle form-switch">
              <input
                class="form-check-input"
                type="checkbox"
                role="switch"
                id="rss-processing-enabled"
                formControlName="rss_processing_enabled"
              />
            </span>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-6 d-flex align-items-center">
            {{ 'pages.qb-settings.tab.rss.field.refresh-interval' | translate }}
          </div>
          <div class="col-6">
            <input
              type="number"
              class="form-control"
              formControlName="rss_refresh_interval"
              min="1"
            />
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-6 d-flex align-items-center">
            {{ 'pages.qb-settings.tab.rss.field.max-articles' | translate }}
          </div>
          <div class="col-6">
            <input
              type="number"
              class="form-control"
              formControlName="rss_max_articles_per_feed"
              min="1"
            />
          </div>
        </div>
      </div>
    </fieldset>
  </div>
</form>
