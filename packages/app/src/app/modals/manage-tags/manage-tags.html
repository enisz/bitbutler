<div class="modal-header">
  <h5 class="modal-title">{{ 'components.modals.manage-tags.title' | translate }}</h5>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body">
  <ag-grid-angular
    class="w-100 d-block bb-manage-tags-grid"
    (gridReady)="onGridReady($event)"
    [rowData]="rows()"
    [columnDefs]="colDefs"
    [gridOptions]="gridOptions"
    [theme]="theme() === 'dark' ? bbDark : bbLight"
  />
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-primary btn-sm btn-split" (click)="openNew()">
    <bb-btn-content
      [icon]="icon.faPlus"
      [text]="'general.button.new' | translate"
      position="end"
    ></bb-btn-content>
  </button>
  <button
    type="button"
    class="btn btn-danger btn-sm btn-split"
    [disabled]="!canDelete()"
    (click)="deleteSelected()"
  >
    <bb-btn-content
      [icon]="icon.faTrashCan"
      [text]="'general.button.delete' | translate"
      position="end"
    ></bb-btn-content>
  </button>
  <button type="button" class="btn btn-sm btn-split ms-auto" (click)="activeModal.close()">
    <bb-btn-content
      [icon]="icon.faXmark"
      [text]="'general.button.close' | translate"
      position="end"
    ></bb-btn-content>
  </button>
</div>
