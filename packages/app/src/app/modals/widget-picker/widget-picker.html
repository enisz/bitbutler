<div class="offcanvas-header widget-picker">
  <div class="widget-picker__heading">
    <h5 class="offcanvas-title">{{ 'components.modals.widget-picker.title' | translate }}</h5>
    <p class="widget-picker__subtitle text-body-secondary small mb-0">
      {{ 'components.modals.widget-picker.subtitle' | translate }}
    </p>
  </div>
  <button
    type="button"
    class="btn-close"
    aria-label="{{ 'general.button.close' | translate }}"
    (click)="cancel()"
  ></button>
</div>
<div class="offcanvas-body widget-picker">
  <div class="widget-picker__list">
    @for (entry of catalogEntries; track entry.id) {
      <button type="button" class="widget-picker__item" (click)="choose(entry.id)">
        <span class="widget-picker__icon">
          <fa-icon [icon]="entry.icon" />
        </span>
        <span class="widget-picker__text">
          <span class="widget-picker__label">{{ entry.labelKey | translate }}</span>
          <span class="widget-picker__desc text-body-secondary small">{{
            entry.descriptionKey | translate
          }}</span>
        </span>
      </button>
    }
  </div>
</div>
