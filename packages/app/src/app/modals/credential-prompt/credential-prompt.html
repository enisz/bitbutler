<div class="modal-header bb-modal-header">
  <div class="bb-modal-header__text">
    <h5 class="modal-title bb-title-clamp">
      {{ 'components.modals.credential-prompt.title' | translate }}
    </h5>

    <div
      class="small text-body-secondary mt-1 text-truncate"
      [ngbTooltip]="serverName()"
      bbTooltipOverflow
      placement="bottom"
      tooltipClass="single-line-tooltip"
    >
      {{ serverName() }}
    </div>
  </div>

  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
</div>
<div class="modal-body">
  <form [formGroup]="credentialForm" (submit)="connect()">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12 mb-3">
          <div class="form-floating">
            <input
              [autofocus]="!prefillUsername()"
              type="text"
              class="form-control"
              id="credential-username"
              placeholder="Username"
              formControlName="username"
            />
            <label for="credential-username">{{
              'components.modals.server-editor.editor-form.username' | translate
            }}</label>
          </div>
        </div>
        <div class="col-12 mb-3">
          <div class="form-floating">
            <input
              [autofocus]="!!prefillUsername()"
              type="password"
              class="form-control"
              id="credential-password"
              placeholder="Password"
              formControlName="password"
            />
            <label for="credential-password">{{
              'components.modals.server-editor.editor-form.password' | translate
            }}</label>
          </div>
        </div>
        <div class="col-12">
          <div class="bb-options">
            <div class="bb-option">
              <div class="bb-option__text">
                <label class="bb-option__label" for="save-credentials">
                  {{ 'components.modals.credential-prompt.save-credentials' | translate }}
                </label>
                <span class="bb-option__sub">{{
                  'components.modals.credential-prompt.save-credentials-sub' | translate
                }}</span>
              </div>
              <span class="bb-option__toggle form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="save-credentials"
                  formControlName="saveCredentials"
                />
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button type="submit" hidden></button>
  </form>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-primary btn-sm btn-split" (click)="connect()">
    <bb-btn-content
      [icon]="icons.faPlug"
      [text]="'general.button.connect' | translate"
      position="end"
    ></bb-btn-content>
  </button>
  <button type="button" class="btn btn-sm btn-split" (click)="cancel()">
    <bb-btn-content
      [icon]="icons.faXmark"
      [text]="'general.button.cancel' | translate"
      position="end"
    ></bb-btn-content>
  </button>
</div>
