<div class="modal-header">
  <h4 class="modal-title text-danger">
    {{ 'components.modals.delete-torrent.title' | translate }}
  </h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="dismissModal()"></button>
</div>

<div class="modal-body">
  <p>{{ 'components.modals.delete-torrent.message' | translate: { count: selected().length } }}</p>
  <form [formGroup]="deleteForm">
    <div
      class="form-check"
      [ngClass]="{
        'bb-check-danger': deleteForm.get('removeFiles')?.value,
        'text-danger': deleteForm.get('removeFiles')?.value,
      }"
    >
      <input
        class="form-check-input"
        type="checkbox"
        id="remove-files"
        formControlName="removeFiles"
      />
      <label class="form-check-label" for="remove-files">
        {{ 'components.modals.delete-torrent.delete-form.confirmation' | translate }}</label
      >
    </div>
    @if (deleteForm.get('removeFiles')?.value) {
      <p class="mt-2 mb-0 text-danger">
        {{
          'components.modals.delete-torrent.disk-space'
            | translate: { size: totalSize() | fileSize }
        }}
      </p>
    }
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-danger btn-sm btn-split" (click)="closeModal()" autofocus>
    <bb-btn-content
      [icon]="icons.faTrashCan"
      [text]="'general.button.delete' | translate"
      position="end"
    ></bb-btn-content>
  </button>
  <button type="button" class="btn btn-link btn-sm btn-split" (click)="dismissModal()">
    <bb-btn-content
      [icon]="icons.faXmark"
      [text]="'general.button.cancel' | translate"
      position="end"
    ></bb-btn-content>
  </button>
</div>
