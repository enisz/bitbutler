<div class="modal-header">
  <h4 class="modal-title text-danger">
    {{ 'components.modals.delete-torrent.title' | translate }}
  </h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="dismissModal()"></button>
</div>

<div class="modal-body">
  <p>{{ 'components.modals.delete-torrent.message' | translate: { count: selected().length } }}</p>
  <form [formGroup]="deleteForm">
    <app-bb-checkbox
      inputId="remove-files"
      formControlName="removeFiles"
      tone="danger"
      [class.text-danger]="deleteForm.get('removeFiles')?.value"
      [label]="'components.modals.delete-torrent.delete-form.confirmation' | translate"
    />
    @if (deleteForm.get('removeFiles')?.value) {
      <bb-callout
        class="mt-2 d-block"
        variant="info"
        [icon]="icons.faCircleInfo"
        [message]="
          'components.modals.delete-torrent.disk-space'
            | translate: { size: totalSize() | fileSize }
        "
      ></bb-callout>
    }
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-danger btn-sm btn-split" (click)="closeModal()" autofocus>
    <bb-btn-content
      [icon]="icons.faTrashCan"
      [text]="'general.button.delete' | translate"
      position="end"
    ></bb-btn-content>
  </button>
  <button type="button" class="btn btn-sm btn-split" (click)="dismissModal()">
    <bb-btn-content
      [icon]="icons.faXmark"
      [text]="'general.button.cancel' | translate"
      position="end"
    ></bb-btn-content>
  </button>
</div>
