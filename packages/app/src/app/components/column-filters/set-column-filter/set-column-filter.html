<div
  class="bb-set-filter p-2"
  (mousedown)="$event.stopPropagation()"
  (touchstart)="$event.stopPropagation()"
>
  <div class="form-floating bb-filter-input mb-2">
    <input
      type="text"
      class="form-control"
      [id]="instanceId + '-search'"
      [placeholder]="'components.column-filters.set.filter-placeholder' | translate"
      [formControl]="filterCtrl"
    />
    <label [for]="instanceId + '-search'">{{
      'components.column-filters.set.filter-placeholder' | translate
    }}</label>
    @if (filterCtrl.value) {
      <button
        type="button"
        class="bb-filter-clear"
        (click)="filterCtrl.reset('')"
        [attr.aria-label]="'general.button.clear' | translate"
      >
        <fa-icon [icon]="icons.faXmark"></fa-icon>
      </button>
    }
  </div>

  <div class="bb-set-filter-list mb-2">
    <app-bb-check-tree
      [items]="filteredItems()"
      [allLabel]="'components.column-filters.set.select-all' | translate"
      [value]="draftKeys()"
      (valueChange)="setDraft($event)"
    >
      <ng-template bbCheckTreeItem let-item>
        <span
          class="badge bb-status-badge"
          [class.bb-status-badge--selected]="draftValues.has(item.key)"
          >{{ item.count }}</span
        >
      </ng-template>
      <div bbCheckTreeEmpty class="text-body-secondary small py-1">
        {{ 'components.column-filters.set.no-matches' | translate }}
      </div>
    </app-bb-check-tree>
  </div>

  <div class="d-flex gap-2">
    <button
      class="btn btn-sm btn-outline-secondary btn-split flex-fill"
      type="button"
      (click)="clear()"
    >
      <bb-btn-content
        [icon]="icons.faEraser"
        [text]="'general.button.clear' | translate"
        [position]="'end'"
      ></bb-btn-content>
    </button>
    <button
      class="btn btn-sm btn-outline-primary btn-split flex-fill"
      type="button"
      [disabled]="isApplyDisabled()"
      (click)="apply()"
    >
      <bb-btn-content
        [icon]="icons.faCheck"
        [text]="'general.button.apply' | translate"
        [position]="'end'"
      ></bb-btn-content>
    </button>
  </div>
</div>
