<div
  class="bb-datefilter p-2"
  (mousedown)="$event.stopPropagation()"
  (touchstart)="$event.stopPropagation()"
>
  <div class="d-flex bb-datepicker-header mb-1">
    <div class="bb-header-side d-flex justify-content-between align-items-center ps-1">
      <button type="button" class="btn btn-link bb-dp-nav-btn" (click)="moveMonth(dp, -1)">
        <fa-icon [icon]="icons.faChevronLeft"></fa-icon>
      </button>
      <ng-select
        [items]="months"
        bindLabel="label"
        bindValue="value"
        [clearable]="false"
        [searchable]="false"
        [(ngModel)]="viewDate.month"
        (change)="updateView(dp)"
        class="bb-select-month"
      >
      </ng-select>
    </div>

    <div class="bb-header-side d-flex justify-content-between align-items-center pe-1">
      <ng-select
        [items]="years"
        [clearable]="false"
        [searchable]="true"
        [(ngModel)]="viewDate.year"
        (change)="updateView(dp)"
        class="bb-select-year"
      >
      </ng-select>
      <button type="button" class="btn btn-link bb-dp-nav-btn" (click)="moveMonth(dp, 1)">
        <fa-icon [icon]="icons.faChevronRight"></fa-icon>
      </button>
    </div>
  </div>

  <ngb-datepicker
    #dp
    [displayMonths]="2"
    [dayTemplate]="t"
    [outsideDays]="'collapsed'"
    [navigation]="'none'"
    [firstDayOfWeek]="dateFormatService.resolved().firstDayOfWeek"
    (navigate)="onNavigate($event)"
    (dateSelect)="onSelect($event)"
  >
  </ngb-datepicker>

  <ng-template #t let-date>
    <span
      class="bb-day"
      [class.bb-day--from]="isFrom(date)"
      [class.bb-day--from-range]="isRangeStart(date)"
      [class.bb-day--to]="isTo(date)"
      [class.bb-day--between]="isInside(date) || isHovered(date)"
      [class.bb-day--today]="isToday(date)"
      (mouseenter)="hoveredDate = date"
      (mouseleave)="hoveredDate = null"
    >
      {{ date.day }}
    </span>
  </ng-template>

  <div class="d-flex align-items-center mt-3 gap-2 px-1">
    @if (fromDate) {
      <div class="d-flex flex-column gap-1">
        <div class="small text-body-secondary d-flex align-items-center gap-2">
          <span style="width: 42px; opacity: 0.7">
            {{
              (toDate
                ? 'components.datepicker-range-filter.label.from'
                : 'components.datepicker-range-filter.label.date'
              ) | translate
            }}:
          </span>
          <span class="bb-date-chip">{{ fmt(fromDate) }}</span>
        </div>
        @if (toDate) {
          <div class="small text-body-secondary d-flex align-items-center gap-2">
            <span style="width: 42px; opacity: 0.7">
              {{ 'components.datepicker-range-filter.label.to' | translate }}:
            </span>
            <span class="bb-date-chip">{{ fmt(toDate) }}</span>
          </div>
        }
      </div>
    }

    <div class="d-flex gap-2 align-items-center ms-auto">
      <button
        class="btn btn-sm btn-outline-secondary btn-split"
        type="button"
        (click)="selectToday(dp)"
      >
        <bb-btn-content
          [icon]="icons.faCalendarDay"
          [text]="'general.button.today' | translate"
          [position]="'end'"
        ></bb-btn-content>
      </button>
      <button class="btn btn-sm btn-outline-secondary btn-split" type="button" (click)="clear()">
        <bb-btn-content
          [icon]="icons.faEraser"
          [text]="'general.button.clear' | translate"
          [position]="'end'"
        ></bb-btn-content>
      </button>
      <button
        class="btn btn-sm btn-outline-primary btn-split"
        type="button"
        [disabled]="isApplyDisabled()"
        (click)="apply()"
      >
        <bb-btn-content
          [icon]="icons.faCheck"
          [text]="'general.button.apply' | translate"
          [position]="'end'"
        ></bb-btn-content>
      </button>
    </div>
  </div>
</div>
