<div
  class="progress position-relative bb-progress"
  [class.bb-progress--compact]="mode() === 'compact'"
  [style.--p]="progressPercent() + '%'"
  [style.--label-on-fill]="'var(--bb-' + displayVariant() + '-ink)'"
>
  <div
    class="progress-bar"
    [class]="'bg-' + displayVariant()"
    [style.width.%]="progressPercent()"
    role="progressbar"
  ></div>

  @if (mode() === 'normal') {
    <small class="bb-progress-label"> {{ progressPercent() | number: '1.0-1' }}% </small>
  }
</div>
