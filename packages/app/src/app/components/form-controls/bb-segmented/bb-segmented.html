@for (option of options(); track option.value) {
  <label class="bb-ctl-segment" [class.bb-ctl-disabled]="isDisabled() || option.disabled">
    <input
      type="radio"
      class="bb-ctl-input"
      [name]="name"
      [checked]="value() === option.value"
      [disabled]="isDisabled() || option.disabled"
      (change)="select(option.value)"
      (blur)="touch()"
    />
    {{ option.label }}
  </label>
}
