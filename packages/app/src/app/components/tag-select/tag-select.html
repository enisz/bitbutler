<div class="container-fluid px-0">
  <div class="row">
    <div class="col-11">
      <div class="form-floating">
        <ng-select
          [items]="tags()"
          [multiple]="true"
          [hideSelected]="true"
          [searchable]="true"
          [clearable]="true"
          [clearSearchOnAdd]="true"
          [formControl]="selectControl"
          [keyDownFn]="keyDownFn"
          [openOnEnter]="false"
          #ngselect
        >
          <ng-template ng-footer-tmp>
            <div class="px-3 py-2 border-top">
              <button type="button" class="btn btn-link btn-sm p-0" (click)="openManageTags()">
                {{ 'components.tag-select.manage' | translate }}
              </button>
            </div>
          </ng-template>
        </ng-select>
        <label>{{ 'components.tag-select.label' | translate }}</label>
      </div>
    </div>

    <div class="col-1 d-flex align-items-center">
      <bb-popover
        [subject]="'components.tag-select.popover.title' | translate"
        [description]="tagPopover"
        placement="left"
      ></bb-popover>
    </div>
  </div>
</div>

<ng-template #tagPopover>
  <p>{{ 'components.tag-select.popover.description.line1' | translate }}</p>
  <p>{{ 'components.tag-select.popover.description.line2' | translate }}</p>
</ng-template>
