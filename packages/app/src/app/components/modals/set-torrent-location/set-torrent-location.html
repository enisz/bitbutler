<div class="modal-header bb-modal-header" data-testid="set-location-modal">
  <div class="bb-modal-header__text">
    <h5 class="modal-title bb-title-clamp">
      {{ 'components.modals.set-torrent-location.title' | translate }}
    </h5>

    <div
      #element
      class="small text-body-secondary mt-1 bb-hash-clamp"
      [ngbTooltip]="selected() === 1 ? torrent().name : null"
      bbTooltipOverflow
      tooltipClass="single-line-tooltip"
      placement="bottom"
    >
      @if (selected() > 1) {
        {{ 'general.label.torrent-selected' | translate: { count: selected() } }}
      } @else {
        {{ torrent().name }}
      }
    </div>
  </div>

  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>
<div class="modal-body">
  <form [formGroup]="setLocationForm" (submit)="handleSubmit()">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <app-save-path-select
            formControlName="path"
            [autofocus]="true"
            [clearable]="true"
          ></app-save-path-select>
        </div>
      </div>
    </div>
    <button type="submit" hidden [disabled]="!canSave()"></button>
  </form>
</div>
<div class="modal-footer">
  <button
    type="button"
    class="btn btn-secondary"
    (click)="handleSubmit()"
    [disabled]="!canSave()"
    data-testid="set-location-save"
  >
    {{ 'general.button.save' | translate }}
  </button>
  <button
    type="button"
    class="btn btn-link"
    (click)="activeModal.close()"
    data-testid="set-location-cancel"
  >
    {{ 'general.button.cancel' | translate }}
  </button>
</div>
