<div class="modal-header">
  <h4 class="modal-title">
    {{ 'components.modals.credential-prompt.title' | translate: { name: serverName() } }}
  </h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
</div>
<div class="modal-body">
  <form [formGroup]="credentialForm" (submit)="connect()">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12 mb-3">
          <div class="form-floating">
            <input
              [autofocus]="!prefillUsername()"
              type="text"
              class="form-control"
              id="credential-username"
              placeholder="Username"
              formControlName="username"
            />
            <label for="credential-username">{{
              'components.modals.server-editor.editor-form.username' | translate
            }}</label>
          </div>
        </div>
        <div class="col-12 mb-3">
          <div class="form-floating">
            <input
              [autofocus]="!!prefillUsername()"
              type="password"
              class="form-control"
              id="credential-password"
              placeholder="Password"
              formControlName="password"
            />
            <label for="credential-password">{{
              'components.modals.server-editor.editor-form.password' | translate
            }}</label>
          </div>
        </div>
        <div class="col-12">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="save-credentials"
              formControlName="saveCredentials"
            />
            <label class="form-check-label" for="save-credentials">{{
              'components.modals.credential-prompt.save-credentials' | translate
            }}</label>
          </div>
        </div>
      </div>
    </div>
    <button type="submit" hidden></button>
  </form>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-primary" (click)="connect()">
    {{ 'general.button.connect' | translate }}
  </button>
  <button type="button" class="btn btn-link" (click)="cancel()">
    {{ 'general.button.cancel' | translate }}
  </button>
</div>
