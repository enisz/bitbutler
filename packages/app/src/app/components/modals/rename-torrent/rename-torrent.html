<div class="modal-header bb-modal-header">
  <div class="bb-modal-header__text">
    <h5 class="modal-title bb-title-clamp">
      {{ 'components.modals.rename-torrent.title' | translate }}
    </h5>

    <div
      #element
      class="small text-body-secondary mt-1 bb-hash-clamp"
      [ngbTooltip]="torrent().name"
      bbTooltipOverflow
      tooltipClass="single-line-tooltip"
      placement="bottom"
    >
      {{ torrent().name }}
    </div>
  </div>

  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>
<div class="modal-body">
  <form [formGroup]="renameTorrentForm" (submit)="handleSubmit()">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="form-floating">
            <input
              type="text"
              class="form-control"
              id="name"
              placeholder="Name"
              formControlName="name"
              autofocus
            />
            <label for="name">{{
              'components.modals.rename-torrent.rename-torrent-form.name' | translate
            }}</label>
          </div>
        </div>
      </div>
    </div>
    <button type="submit" hidden [disabled]="!canSave()"></button>
  </form>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-primary" (click)="handleSubmit()" [disabled]="!canSave()">
    {{ 'general.button.save' | translate }}
  </button>
  <button type="button" class="btn btn-link" (click)="activeModal.dismiss()">
    {{ 'general.button.cancel' | translate }}
  </button>
</div>
