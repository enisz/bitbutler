@if (loading()) {
  <div class="w-100 text-center">
    <app-bb-spinner></app-bb-spinner>
    <small class="d-block mt-2">{{
      'components.modals.torrent-details.content.loading' | translate
    }}</small>
  </div>
} @else {
  <app-bb-file-tree
    [files]="content()"
    [expandAll]="false"
    [showMeta]="true"
    [allowEdit]="true"
    [startInEditMode]="startInEditMode"
    (saved)="onSaved($event)"
    (editModeChange)="onEditModeChange($event)"
  >
  </app-bb-file-tree>
}
