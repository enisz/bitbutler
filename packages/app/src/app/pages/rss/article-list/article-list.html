<section class="rss-items">
  <div class="rss-items__heading">
    <span>{{ 'pages.rss.items.heading' | translate }}</span>
    <span class="rss-items__count">{{
      'pages.rss.items.count' | translate: { shown: articles().length, total: total() }
    }}</span>
  </div>

  <div class="rss-items__list">
    @for (article of articles(); track article.key) {
      <button
        type="button"
        class="rss-item"
        [class.rss-item--unread]="!article.isRead"
        [class.rss-item--active]="selectedKey() === article.key"
        [attr.aria-current]="selectedKey() === article.key ? 'true' : null"
        (click)="select(article)"
        (dblclick)="download(article)"
      >
        <span
          class="rss-item__dot"
          [attr.aria-label]="!article.isRead ? ('pages.rss.items.unread-dot' | translate) : null"
        ></span>
        @if (article.chip) {
          <span class="rss-item__chip">{{ article.chip }}</span>
        }
        <span class="rss-item__title">{{ article.title }}</span>
        <span class="rss-item__age">{{ ageLabel(article) }}</span>
      </button>
    } @empty {
      @if (emptyKey(); as key) {
        <div class="rss-items__empty">
          <span>{{ key | translate }}</span>
          @if (loadFailed()) {
            <button type="button" class="btn btn-sm btn-primary mt-2" (click)="retry()">
              {{ 'general.button.retry' | translate }}
            </button>
          }
        </div>
      }
    }
  </div>
</section>
