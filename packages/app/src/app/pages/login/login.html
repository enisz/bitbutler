<div class="login-container">
  @if (showHero()) {
    <div class="login-hero-side">
      <div class="hero-content">
        <div class="hero-logo-wrapper">
          <img [ngSrc]="logoUrl()" alt="BitButler logo" width="260" height="260" priority />
          <span class="hero-version-badge cursor-pointer user-select-none" (click)="goToRelease()"
            >v{{ version }}</span
          >
        </div>
        <h1 class="hero-title">BitButler</h1>
        <p class="hero-subtitle mb-0">{{ 'pages.login.tagline' | translate }}</p>
      </div>
    </div>
  }

  <div class="login-form-side">
    @if (!showHero()) {
      <div class="mobile-brand-header text-center mb-4">
        <img
          [ngSrc]="logoUrl()"
          alt="BitButler logo"
          width="180"
          height="180"
          priority
          class="mb-3 mobile-logo"
        />
        <h2 class="fw-bold mb-1">BitButler</h2>
        <p class="text-body-secondary small mb-0">{{ 'pages.login.tagline' | translate }}</p>
      </div>
    }

    <div class="form-wrapper">
      @if (showHero()) {
        <div class="mb-4">
          <h3 class="form-title">
            {{ 'pages.login.form-title' | translate }}
          </h3>
          <p class="text-body-secondary small mb-0">
            {{ 'pages.login.form-subtitle' | translate }}
          </p>
        </div>
      }

      <form [formGroup]="serverForm" class="mb-4">
        <div class="form-floating">
          <ng-select
            id="server"
            bindLabel="name"
            bindValue="id"
            formControlName="server"
            placeholder="No hosts"
            [searchable]="false"
            [clearable]="false"
            [items]="servers()"
            [fixedPlaceholder]="false"
            [readonly]="servers().length === 0"
            [trackByFn]="trackByFn"
          >
            <ng-template ng-label-tmp let-item="item">{{ item.name }}</ng-template>
          </ng-select>
          <label for="server">{{ 'pages.login.server-form.host' | translate }}</label>
        </div>
      </form>

      <div class="d-flex flex-column gap-3">
        <button
          type="button"
          class="btn btn-lg btn-primary"
          (click)="connect()"
          [disabled]="!canConnect()"
        >
          {{ 'general.button.connect' | translate }}
        </button>
        <button type="button" class="btn btn-lg btn-dashed-secondary" (click)="openManageServers()">
          {{ 'general.button.manage-servers' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
