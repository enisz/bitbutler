<nav
  class="bb-nav-rail d-flex flex-column align-items-center"
  [attr.aria-label]="'pages.shell.nav.label' | translate"
>
  <a
    class="bb-nav-rail-item"
    routerLink="/pages/torrent-list"
    routerLinkActive="active"
    [ngbTooltip]="'pages.shell.nav.torrents' | translate"
    placement="start"
    [attr.aria-label]="'pages.shell.nav.torrents' | translate"
  >
    <fa-icon [icon]="icons.faList"></fa-icon>
  </a>

  <div class="bb-nav-rail-bottom d-flex flex-column align-items-center">
    <button
      type="button"
      class="bb-nav-rail-item"
      (click)="openAbout()"
      [ngbTooltip]="'pages.shell.nav.about' | translate"
      placement="start"
      [attr.aria-label]="'pages.shell.nav.about' | translate"
    >
      <fa-icon [icon]="icons.faCircleInfo"></fa-icon>
    </button>

    <button
      type="button"
      class="bb-nav-rail-item"
      (click)="disconnect()"
      [ngbTooltip]="'pages.shell.nav.disconnect' | translate"
      placement="start"
      [attr.aria-label]="'pages.shell.nav.disconnect' | translate"
    >
      <fa-icon [icon]="icons.faRightFromBracket"></fa-icon>
    </button>
  </div>
</nav>
