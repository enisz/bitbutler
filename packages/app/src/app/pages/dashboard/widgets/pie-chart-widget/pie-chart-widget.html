<div class="pie-chart-widget">
  <app-widget-menu [visible]="editMode" (configure)="onConfigure?.()" (remove)="onRemove?.()" />
  <div class="pie-chart-widget__chart">
    <canvas
      baseChart
      class="pie-chart-widget__canvas"
      [type]="chartType"
      [data]="buildConfig().data"
      [options]="buildConfig().options"
    ></canvas>
  </div>
</div>
