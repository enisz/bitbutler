<div class="bar-chart-widget">
  <app-widget-menu (configure)="onConfigure?.()" (remove)="onRemove?.()" />
  <div class="bar-chart-widget__header">
    <div class="bar-chart-widget__title">{{ fieldLabelKey() | translate }}</div>
  </div>
  @let config = buildConfig();
  <div class="bar-chart-widget__chart">
    <canvas
      baseChart
      class="bar-chart-widget__canvas"
      [type]="chartType"
      [data]="config.data"
      [options]="config.options"
    ></canvas>
  </div>
</div>
