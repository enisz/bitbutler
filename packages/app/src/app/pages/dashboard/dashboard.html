<div class="dashboard">
  <header class="dashboard__header">
    <div class="dashboard__heading">
      <h1>{{ 'pages.dashboard.title' | translate }}</h1>
      <p class="dashboard__subtitle text-body-secondary small mb-0">
        {{ 'pages.dashboard.subtitle' | translate }}
      </p>
    </div>
    <div class="dashboard__actions">
      <div class="dashboard__switch form-switch">
        <input
          class="form-check-input"
          type="checkbox"
          role="switch"
          id="dashboardLiveToggle"
          [checked]="!isPaused()"
          (change)="toggleLive()"
        />
        <label class="form-check-label small" for="dashboardLiveToggle">
          {{ 'pages.dashboard.live-toggle.label' | translate }}
        </label>
      </div>
      @if (editMode()) {
        <button type="button" class="btn btn-outline-primary btn-sm" (click)="addWidget()">
          <fa-icon [icon]="icon.faPlus" />
          {{ 'pages.dashboard.add-widget' | translate }}
        </button>
      }
      <div class="dashboard__switch form-switch">
        <input
          class="form-check-input"
          type="checkbox"
          role="switch"
          id="dashboardEditToggle"
          [checked]="editMode()"
          (change)="toggleEditMode()"
        />
        <label class="form-check-label small" for="dashboardEditToggle">
          {{ 'pages.dashboard.edit-toggle.label' | translate }}
        </label>
      </div>
    </div>
  </header>

  <gridstack
    class="dashboard__grid"
    [options]="gridOptions()"
    (changeCB)="onGridChange($event)"
    (dragStartCB)="onInteractionStart($event)"
    (dragStopCB)="onInteractionStop($event)"
    (resizeStartCB)="onInteractionStart($event)"
    (resizeStopCB)="onInteractionStop($event)"
  ></gridstack>
</div>
