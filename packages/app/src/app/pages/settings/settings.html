<div class="modal-header bb-modal-header" data-testid="settings-modal">
  <div class="bb-modal-header__text">
    <h5 class="modal-title bb-title-clamp">{{ 'pages.settings.title' | translate }}</h5>

    <ul class="nav nav-tabs bb-modal-tabs">
      @for (tab of tabs; track tab.id) {
        <li class="nav-item">
          <button
            class="nav-link"
            [class.active]="activeTabId() === tab.id"
            (click)="selectTab(tab.id)"
            [attr.data-testid]="'settings-tab-' + tab.id"
          >
            {{ tab.label | translate }}
            @if (stateService.isDirtyMap()[tab.id]) {
              <fa-icon
                [icon]="icon.faPencil"
                class="ms-2"
                [ngbTooltip]="'components.modals.guard.unsaved-indicator' | translate"
              ></fa-icon>
            }
          </button>
        </li>
      }
    </ul>
  </div>

  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body">
  @if (loadedComponents().size > 0) {
    <div class="bb-tab-panels">
      @for (tab of tabs; track tab.id) {
        <div class="bb-tab-panel" [class.bb-tab-panel--active]="activeTabId() === tab.id">
          <ng-container *ngComponentOutlet="loadedComponents().get(tab.id)!"></ng-container>
        </div>
      }
    </div>
  } @else {
    <app-bb-spinner></app-bb-spinner>
  }
</div>

<div class="modal-footer">
  <button
    type="button"
    class="btn btn-secondary"
    [disabled]="!stateService.isDirty()"
    (click)="onSave()"
    data-testid="settings-save"
  >
    {{ 'general.button.save' | translate }}
  </button>
  <button
    type="button"
    class="btn btn-link"
    (click)="activeModal.dismiss()"
    autofocus
    data-testid="settings-close"
  >
    {{ 'general.button.close' | translate }}
  </button>
</div>
