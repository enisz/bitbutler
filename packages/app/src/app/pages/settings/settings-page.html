<app-settings-shell
  [config]="config"
  [activePaneId]="activePaneId()"
  [isDirty]="stateService.isDirty()"
  [dirtyMap]="stateService.isDirtyMap()"
  [paneDirtyMap]="paneDirtyMap()"
  [paneVersions]="stateService.paneVersions()"
  (discardPane)="stateService.discardPane($event)"
  (restorePaneDefaults)="stateService.restorePaneDefaults($event)"
  (actionRun)="onActionRun($event)"
  (save)="onSave()"
  (back)="onBack()"
/>
