@if (settingsLoaded()) {
  <form [formGroup]="generalSettingsForm" class="bb-cards">
    <app-bb-section-card [title]="'pages.settings.tab.general.label.appearance' | translate">
      <div class="container" formGroupName="appearance">
        <div class="row mt-2 mb-3">
          <div class="col-6 d-flex align-items-center">
            {{ 'pages.settings.tab.general.general-settings-form.appearance.family' | translate }}
          </div>

          <div class="col-6">
            <ng-select
              [items]="families"
              [clearable]="false"
              [openOnEnter]="false"
              [clearSearchOnAdd]="true"
              [searchable]="false"
              bindLabel="label"
              bindValue="value"
              formControlName="family"
            >
              <ng-template ng-option-tmp let-item="item" let-index="index" let-search="searchTerm">
                <div class="d-flex flex-row align-items-center">
                  <app-bb-logo [family]="item.value" [size]="25" />
                  <span class="ms-3 mt-1">{{ item.label }}</span>
                </div>
              </ng-template>

              <ng-template ng-label-tmp let-item="item">
                <div class="d-flex flex-row align-items-center">
                  <app-bb-logo [family]="item.value" [size]="25" />
                  <span class="ms-3 mt-1">{{ item.label }}</span>
                </div>
              </ng-template>
            </ng-select>
          </div>
        </div>

        <div class="row mt-2 mb-3">
          <div class="col-6 d-flex align-items-center">
            {{ 'pages.settings.tab.general.general-settings-form.appearance.mode' | translate }}
          </div>

          <div class="col-6">
            <ng-select
              [items]="modes()"
              [clearable]="false"
              [openOnEnter]="false"
              [clearSearchOnAdd]="true"
              [searchable]="false"
              bindLabel="label"
              bindValue="value"
              formControlName="mode"
            >
              <ng-template ng-option-tmp let-item="item" let-index="index" let-search="searchTerm">
                <div class="d-flex flex-row align-items-center">
                  <div
                    class="mode-indicator me-2"
                    [attr.data-bb-theme]="
                      generalSettingsForm.controls.appearance.controls.family.value
                    "
                    [ngClass]="item.value"
                  ></div>
                  <span class="ms-2 mt-1">{{ item.label }}</span>
                </div>
              </ng-template>

              <ng-template ng-label-tmp let-item="item">
                <div class="d-flex flex-row align-items-center">
                  <div
                    class="mode-indicator me-2"
                    [attr.data-bb-theme]="
                      generalSettingsForm.controls.appearance.controls.family.value
                    "
                    [ngClass]="item.value"
                  ></div>
                  <span class="ms-2 mt-1">{{ item.label }}</span>
                </div>
              </ng-template>
            </ng-select>
          </div>
        </div>
      </div>
    </app-bb-section-card>
  </form>
} @else {
  <app-bb-spinner></app-bb-spinner>
}
