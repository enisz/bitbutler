@if (settingsLoaded()) {
  <form [formGroup]="generalSettingsForm" class="bb-cards">
    <app-bb-section-card [title]="'pages.settings.tab.general.label.startup' | translate">
      <div class="bb-options bb-options--grid bb-startup-grid">
        <app-bb-switch
          inputId="open-at-login"
          [formControl]="generalSettingsForm.controls.startup.controls.openAtLogin"
          [label]="
            'pages.settings.tab.general.general-settings-form.startup.open-at-login' | translate
          "
          [sub]="'pages.settings.tab.general.popover.open-at-login.sub' | translate"
        />
        <app-bb-switch
          inputId="start-minimized"
          [formControl]="generalSettingsForm.controls.startup.controls.startMinimized"
          [label]="
            'pages.settings.tab.general.general-settings-form.startup.start-minimized' | translate
          "
          [sub]="'pages.settings.tab.general.popover.start-minimized.sub' | translate"
        />
        <app-bb-switch
          inputId="automatic-update"
          [formControl]="generalSettingsForm.controls.behavior.controls.automaticUpdate"
          [label]="
            'pages.settings.tab.general.general-settings-form.behavior.automatic-update' | translate
          "
          [sub]="'pages.settings.tab.general.popover.automatic-update.sub' | translate"
        />
      </div>

      @if (showNoDefaultHostHint()) {
        <small class="text-warning d-block mt-2">
          <fa-icon [icon]="icons['faTriangleExclamation']" class="me-1" />
          {{
            'pages.settings.tab.general.general-settings-form.startup.no-default-host-hint'
              | translate
          }}
        </small>
      }
    </app-bb-section-card>
  </form>
} @else {
  <app-bb-spinner></app-bb-spinner>
}
