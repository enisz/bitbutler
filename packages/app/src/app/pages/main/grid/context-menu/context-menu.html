<div class="bb-menu" role="menu" (contextmenu)="$event.preventDefault()">
  @for (entry of items; track trackBy($index, entry)) {
    @if (entry.kind === 'header') {
      <div class="bb-header">
        {{ entry.label | translate }}
      </div>
    }
    @if (entry.kind === 'divider') {
      <div class="bb-sep"></div>
    }
    @if (entry.kind === 'item') {
      <button
        type="button"
        class="bb-item"
        [class.bb-danger]="entry.variant === 'danger'"
        [class.bb-warning]="entry.variant === 'warning'"
        [class.bb-success]="entry.variant === 'success'"
        [class.bb-info]="entry.variant === 'info'"
        [class.bb-item--disabled]="entry.disabled"
        [attr.aria-disabled]="entry.disabled ? 'true' : null"
        [ngbTooltip]="entry.tooltip ? (entry.tooltip | translate) : null"
        [disableTooltip]="!(entry.disabled && entry.tooltip)"
        [placement]="entry.id === 'files.openDestination' ? 'top' : 'right'"
        container="body"
        (click)="onEntryClick(entry)"
        role="menuitem"
      >
        <span class="bb-icon" aria-hidden="true">
          @if (entry.icon) {
            <fa-icon [icon]="entry.icon"></fa-icon>
          }
        </span>

        <span class="bb-label">{{ entry.label | translate }}</span>

        @if (entry.hint) {
          <span class="bb-hint">{{ entry.hint }}</span>
        }
      </button>
    }
    @if (entry.kind === 'submenu') {
      <button
        type="button"
        class="bb-item"
        [class.bb-item--submenu-open]="activeSubmenuId() === entry.id"
        [class.bb-danger]="entry.variant === 'danger'"
        [class.bb-warning]="entry.variant === 'warning'"
        [class.bb-success]="entry.variant === 'success'"
        [class.bb-info]="entry.variant === 'info'"
        [disabled]="entry.disabled"
        (mouseenter)="onSubmenuEnter(entry, asHtmlElement($event.currentTarget))"
        (mouseleave)="onSubmenuLeave()"
        role="menuitem"
        aria-haspopup="menu"
        [attr.aria-expanded]="activeSubmenuId() === entry.id"
      >
        <span class="bb-icon" aria-hidden="true">
          @if (entry.icon) {
            <fa-icon [icon]="entry.icon"></fa-icon>
          }
        </span>

        <span class="bb-label">{{ entry.label | translate }}</span>

        <span class="bb-chevron" aria-hidden="true">
          <fa-icon [icon]="faChevronRight"></fa-icon>
        </span>
      </button>
    }
  }
</div>
