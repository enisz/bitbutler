<div class="d-flex flex-row vw-100 vh-100">
  <aside class="bb-sidebar-width flex-shrink-0 d-flex flex-column min-h-0">
    <div class="bb-brand d-flex flex-row align-items-center pe-none user-select-none gap-2">
      <img [ngSrc]="logoUrl()" alt="Bitbutler Logo" width="34" height="34" priority />

      <div class="d-flex flex-column min-w-0">
        <div class="brand-title">BitButler</div>
        @if (currentServer()) {
          <div class="brand-status d-flex flex-row align-items-center gap-1">
            <span class="status-dot" [class]="connectionStatus()"></span>
            <small>{{ currentServer()?.name }}</small>
          </div>
        }
      </div>
    </div>

    <div class="flex-grow-1 min-h-0 overflow-auto">
      <app-status></app-status>
    </div>
  </aside>

  <main class="d-flex flex-column flex-grow-1 min-w-0 min-h-0">
    <div class="flex-shrink-0">
      <app-button-bar></app-button-bar>
    </div>

    <div class="flex-grow-1 min-h-0 overflow-hidden">
      <app-grid class="h-100 w-100"></app-grid>
    </div>

    <footer class="flex-shrink-0">
      <app-server-state [state]="serverState()"></app-server-state>
    </footer>
  </main>
</div>
