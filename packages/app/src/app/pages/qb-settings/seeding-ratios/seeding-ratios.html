<form [formGroup]="form">
  <div class="bb-cards">
    <app-bb-section-card
      [title]="'pages.qb-settings.tab.seeding-ratios.label.share-ratio' | translate"
    >
      <div class="bb-options">
        <div class="bb-options mb-3">
          <app-bb-switch
            inputId="max-ratio-enabled"
            formControlName="max_ratio_enabled"
            [label]="'pages.qb-settings.tab.seeding-ratios.field.max-ratio-enabled' | translate"
          />
        </div>
        <div class="bb-option">
          <div class="bb-option__text" bbOptionText>
            <span class="bb-option__label">
              {{ 'pages.qb-settings.tab.seeding-ratios.field.max-ratio' | translate }}
            </span>
          </div>
          <div class="bb-option__control">
            <input
              type="number"
              class="form-control"
              formControlName="max_ratio"
              min="0"
              step="0.1"
            />
          </div>
        </div>
        <div class="bb-option bb-option--stacked">
          <div class="bb-option__text" bbOptionText>
            <span class="bb-option__label" id="max-ratio-act-label">
              {{ 'pages.qb-settings.tab.seeding-ratios.field.max-ratio-act' | translate }}
            </span>
          </div>
          <app-bb-radio-group
            appearance="cards"
            formControlName="max_ratio_act"
            aria-labelledby="max-ratio-act-label"
          >
            <app-bb-radio
              [value]="0"
              [label]="'pages.qb-settings.tab.seeding-ratios.ratio-act.pause' | translate"
              [sub]="'pages.qb-settings.tab.seeding-ratios.ratio-act.pause-sub' | translate"
            />
            <app-bb-radio
              [value]="1"
              [label]="'pages.qb-settings.tab.seeding-ratios.ratio-act.remove' | translate"
              [sub]="'pages.qb-settings.tab.seeding-ratios.ratio-act.remove-sub' | translate"
            />
          </app-bb-radio-group>
        </div>
      </div>
    </app-bb-section-card>

    <app-bb-section-card
      [title]="'pages.qb-settings.tab.seeding-ratios.label.seeding-time' | translate"
    >
      <div class="bb-options">
        <div class="bb-options mb-3">
          <app-bb-switch
            inputId="max-seeding-time-enabled"
            formControlName="max_seeding_time_enabled"
            [label]="
              'pages.qb-settings.tab.seeding-ratios.field.max-seeding-time-enabled' | translate
            "
          />
        </div>
        <div class="bb-option">
          <div class="bb-option__text" bbOptionText>
            <span class="bb-option__label">
              {{ 'pages.qb-settings.tab.seeding-ratios.field.max-seeding-time' | translate }}
            </span>
          </div>
          <div class="bb-option__control">
            <input type="number" class="form-control" formControlName="max_seeding_time" min="0" />
          </div>
        </div>
      </div>
    </app-bb-section-card>
  </div>
</form>
