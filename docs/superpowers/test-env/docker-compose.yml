# Throwaway qBittorrent + RSS test feed for developing BitButler's RSS view (#337).
# Self-contained: config, test feed and seed script are embedded below. Named volumes only,
# so `down -v` removes everything. See README.md next to this file.
#
# Needs Docker Compose v2.23.1 or newer (inline `configs.content`).
name: bb-rss-test

services:
  # One-shot: writes a pre-seeded qBittorrent.conf (admin / bitbutler-test) into the config volume
  # the first time, so the WebUI password does not have to be set by hand.
  qb-init:
    image: alpine:3
    configs:
      - source: qb_conf
        target: /seed/qBittorrent.conf
    volumes:
      - qb-config:/config
    command:
      - sh
      - -c
      - mkdir -p /config/qBittorrent && { [ -f /config/qBittorrent/qBittorrent.conf ] || cp /seed/qBittorrent.conf /config/qBittorrent/qBittorrent.conf; }
    restart: 'no'

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    depends_on:
      qb-init:
        condition: service_completed_successfully
    # curl does not send cookies to single-label hostnames, so the seed script uses this dotted alias.
    networks:
      default:
        aliases:
          - qbittorrent.test
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: Etc/UTC
      WEBUI_PORT: '8080'
    ports:
      # Bound to localhost by default. Use QB_BIND=0.0.0.0 to reach it from another machine.
      - '${QB_BIND:-127.0.0.1}:${QB_WEBUI_PORT:-8080}:8080'
    volumes:
      - qb-config:/config
      - qb-downloads:/downloads
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/']
      interval: 5s
      timeout: 3s
      retries: 40
    restart: 'no'

  # Serves the test RSS feed at http://feed/torrents.xml inside the compose network
  # (and at http://<host>:${FEED_PORT:-8081}/torrents.xml from the host).
  feed:
    image: nginx:alpine
    configs:
      - source: feed_xml
        target: /usr/share/nginx/html/torrents.xml
    ports:
      - '${QB_BIND:-127.0.0.1}:${FEED_PORT:-8081}:80'
    restart: 'no'

  # One-shot: logs in and subscribes qBittorrent to the test feed and to the FOSS Torrents feed.
  # RSS processing is left OFF on purpose so the "RSS fetching is disabled" banner can be tested.
  qb-seed:
    image: alpine:3
    depends_on:
      qbittorrent:
        condition: service_healthy
      feed:
        condition: service_started
    configs:
      - source: seed_sh
        target: /seed.sh
    command: ['sh', '/seed.sh']
    restart: 'no'

volumes:
  qb-config:
  qb-downloads:

configs:
  qb_conf:
    content: |
      [LegalNotice]
      Accepted=true

      [Preferences]
      WebUI\Address=*
      WebUI\HostHeaderValidation=false
      WebUI\CSRFProtection=false
      WebUI\Username=admin
      WebUI\Password_PBKDF2="@ByteArray(YnRidXQxZXJyb3NzMTExMQ==:+ZRZV0VVkXHI5vVkwipRLyp1cffTq3K9TE6tOzgFbzWznI9Jm8/qSd6Sp9Sk1MKTDlXkzbOiM3VivwPn3eMMLA==)"

  seed_sh:
    content: |
      set -e
      apk add --no-cache curl >/dev/null
      until curl -sf -o /dev/null -c /tmp/cj -d 'username=admin&password=bitbutler-test' http://qbittorrent.test:8080/api/v2/auth/login; do sleep 2; done
      curl -s -b /tmp/cj --data-urlencode 'url=http://feed/torrents.xml' --data-urlencode 'path=Test Feed' http://qbittorrent.test:8080/api/v2/rss/addFeed
      curl -s -b /tmp/cj --data-urlencode 'url=https://fosstorrents.com/feed/rss.xml' --data-urlencode 'path=FOSS Torrents' http://qbittorrent.test:8080/api/v2/rss/addFeed
      echo "seeded RSS feeds"

  # Covers every code path of the RSS view:
  #   1 enclosure + category + contentLength  -> chip "Movies", Size row, Download enabled
  #   2 magnet in <link>                      -> Download enabled
  #   3 news-style web link                   -> Download disabled, Open link only
  #   4 <link> ending in .torrent             -> Download enabled
  #   5 nyaa-style textual size + enclosure   -> chip from title prefix, Size "1.2 GiB", Download enabled
  #   6 HTML description with a script tag    -> must render as plain text
  feed_xml:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <rss version="2.0" xmlns:torrent="http://xmlns.ezrss.it/0.1/" xmlns:nyaa="https://nyaa.si/xmlns/nyaa">
        <channel>
          <title>BitButler Test Feed</title>
          <link>http://feed/</link>
          <description>Local feed for testing the RSS view</description>
          <item>
            <title>Enclosure Item</title>
            <guid isPermaLink="false">bb-test-1</guid>
            <pubDate>Sat, 19 Sep 2026 09:00:00 +0000</pubDate>
            <link>http://feed/page/enclosure</link>
            <category>Movies</category>
            <enclosure url="http://feed/sample.torrent" length="1073741824" type="application/x-bittorrent"/>
            <torrent:contentLength>1073741824</torrent:contentLength>
            <description>Item with an enclosure, a category and a byte size.</description>
          </item>
          <item>
            <title>Magnet Item</title>
            <guid isPermaLink="false">bb-test-2</guid>
            <pubDate>Sat, 19 Sep 2026 08:00:00 +0000</pubDate>
            <link>magnet:?xt=urn:btih:0123456789abcdef0123456789abcdef01234567&amp;dn=Magnet+Item</link>
            <description>Item whose link is a magnet URI.</description>
          </item>
          <item>
            <title>[Distribution] - Plain Web Link</title>
            <guid isPermaLink="false">bb-test-3</guid>
            <pubDate>Sat, 19 Sep 2026 07:00:00 +0000</pubDate>
            <link>https://example.com/news/plain-web-link</link>
            <author>@BitButler</author>
            <description>News-style item: the link is a web page, not a torrent.</description>
          </item>
          <item>
            <title>Link Only Torrent</title>
            <guid isPermaLink="false">bb-test-4</guid>
            <pubDate>Fri, 18 Sep 2026 22:00:00 +0000</pubDate>
            <link>http://feed/link-only.torrent</link>
            <description>Item whose link ends in .torrent and has no enclosure.</description>
          </item>
          <item>
            <title>[Anime] - Nyaa Style Size</title>
            <guid isPermaLink="false">bb-test-5</guid>
            <pubDate>Thu, 17 Sep 2026 12:00:00 +0000</pubDate>
            <link>http://feed/page/nyaa-style</link>
            <enclosure url="http://feed/nyaa.torrent" length="0" type="application/x-bittorrent"/>
            <nyaa:size>1.2 GiB</nyaa:size>
            <description>Item with a textual size element.</description>
          </item>
          <item>
            <title>HTML Description</title>
            <guid isPermaLink="false">bb-test-6</guid>
            <pubDate>Mon, 14 Sep 2026 10:00:00 +0000</pubDate>
            <link>http://feed/page/html-description</link>
            <description><![CDATA[<p>Hello <b>world</b> &amp; friends</p><p>Second paragraph<br/>after a break</p><script>alert(1)</script>]]></description>
          </item>
        </channel>
      </rss>
