<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <!-- @template name="Login" description="Server connection / login screen" -->
      <helmet>
        <script src="./ds-base.js"></script>
        <style>
          html,
          body {
            margin: 0;
            padding: 0;
            background: #16120e;
          }
          * {
            box-sizing: border-box;
          }
          button {
            font: inherit;
            cursor: pointer;
          }
          input {
            font: inherit;
          }
          ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
          }
          ::-webkit-scrollbar-thumb {
            background: rgba(240, 225, 200, 0.15);
            border-radius: 99px;
          }
        </style>
      </helmet>
      <div
        onClick="{{ closeAll }}"
        style="
          width: 100vw;
          height: 100vh;
          display: flex;
          flex-direction: column;
          background: #16120e;
          color: #f3e9d8;
          font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
          font-size: 13.5px;
          overflow: hidden;
        "
      >
        <div style="flex: 1 1 auto; min-height: 0; display: flex">
          <div
            style="
              flex: 1 1 55%;
              position: relative;
              background: radial-gradient(circle at 50% 42%, #241d15 0%, #16120e 68%);
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 22px;
            "
          >
            <img
              src="./logo.png"
              alt="logo"
              style="width: 150px; height: 150px; object-fit: cover"
            />
            <div style="text-align: center">
              <div
                style="font-size: 34px; font-weight: 750; letter-spacing: -0.02em; color: #f3e9d8"
              >
                {{ appTitle }}
              </div>
              <div style="font-size: 14px; color: #7c705d; margin-top: 6px">{{ tagline }}</div>
            </div>
          </div>

          <div
            style="
              flex: 1 1 45%;
              border-left: 1px solid rgba(240, 225, 200, 0.08);
              display: flex;
              align-items: center;
              justify-content: center;
              padding: 32px;
            "
          >
            <div style="width: 340px; display: flex; flex-direction: column; gap: 22px">
              <div>
                <div
                  style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em; color: #f3e9d8"
                >
                  Connect to Server
                </div>
                <div style="font-size: 13px; color: #a99c86; margin-top: 6px">
                  Select a host to connect to.
                </div>
              </div>

              <div onClick="{{ stop }}" style="position: relative">
                <div style="font-size: 11px; color: #7c705d; margin-bottom: 6px">Host</div>
                <div
                  onClick="{{ toggleHost }}"
                  style="
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    gap: 10px;
                    padding: 11px 13px;
                    border-radius: 9px;
                    border: 1px solid rgba(240, 225, 200, 0.15);
                    background: #1f1912;
                    cursor: pointer;
                  "
                >
                  <span style="font-size: 14px; font-weight: 600">{{ hostLabel }}</span>
                  <svg
                    width="12"
                    height="12"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#a99c86"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M6 9l6 6 6-6"></path>
                  </svg>
                </div>
                <sc-if value="{{ hostOpen }}" hint-placeholder-val="{{ false }}">
                  <div
                    style="
                      position: absolute;
                      left: 0;
                      right: 0;
                      top: calc(100% + 6px);
                      background: #221b14;
                      border: 1px solid rgba(240, 225, 200, 0.15);
                      border-radius: 9px;
                      padding: 5px;
                      z-index: 10;
                      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
                    "
                  >
                    <sc-for list="{{ hosts }}" as="h" hint-placeholder-count="3">
                      <div
                        onClick="{{ h.pick }}"
                        style="
                          position: relative;
                          padding: 8px 10px;
                          border-radius: 6px;
                          font-size: 13.5px;
                          font-weight: 600;
                          cursor: pointer;
                        "
                      >
                        <sc-if value="{{ h.on }}" hint-placeholder-val="{{ false }}"
                          ><span
                            style="
                              position: absolute;
                              inset: 0;
                              border-radius: 6px;
                              background: rgba(227, 189, 135, 0.13);
                            "
                          ></span
                        ></sc-if>
                        <span style="position: relative">{{ h.label }}</span>
                      </div>
                    </sc-for>
                  </div>
                </sc-if>
              </div>

              <button
                onClick="{{ connect }}"
                style="
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 9px;
                  padding: 13px;
                  border-radius: 9px;
                  border: 1px solid #e3bd87;
                  background: #e3bd87;
                  color: #241a0f;
                  font-size: 14.5px;
                  font-weight: 700;
                "
              >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M17 3a1 1 0 011 1v4h1a1 1 0 011 1 1 1 0 01-1 1h-1v2a5 5 0 01-4 4.9V21a1 1 0 01-2 0v-4.1A5 5 0 018 12v-2H7a1 1 0 01-1-1 1 1 0 011-1h1V4a1 1 0 012 0v4h6V4a1 1 0 011-1z"
                  ></path></svg
                >Connect
              </button>

              <button
                onClick="{{ manageServers }}"
                style="
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 9px;
                  padding: 13px;
                  border-radius: 9px;
                  border: 1px solid #e3bd87;
                  background: transparent;
                  color: #e3bd87;
                  font-size: 14.5px;
                  font-weight: 700;
                "
              >
                <svg
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="4" width="18" height="7" rx="1.5"></rect>
                  <rect x="3" y="13" width="18" height="7" rx="1.5"></rect>
                  <circle cx="7" cy="7.5" r="1"></circle>
                  <circle cx="7" cy="16.5" r="1"></circle></svg
                >Manage Servers
              </button>

              <div
                style="
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  margin-top: 2px;
                "
              >
                <a href="#" style="font-size: 12px; color: #e3bd87; text-decoration: underline"
                  >v1.2.0</a
                >
                <div style="display: flex; align-items: center; gap: 6px">
                  <button
                    title="Language"
                    style="
                      width: 30px;
                      height: 30px;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      border-radius: 7px;
                      border: 1px solid transparent;
                      background: transparent;
                      color: #a99c86;
                    "
                  >
                    <svg
                      width="15"
                      height="15"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.9"
                    >
                      <circle cx="12" cy="12" r="9"></circle>
                      <path
                        d="M3 12h18M12 3c2.5 2.6 4 5.7 4 9s-1.5 6.4-4 9c-2.5-2.6-4-5.7-4-9s1.5-6.4 4-9z"
                      ></path>
                    </svg>
                  </button>

                  <div onClick="{{ stop }}" style="position: relative">
                    <button
                      title="Theme Family"
                      onClick="{{ toggleTheme }}"
                      style="
                        width: 30px;
                        height: 30px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        border-radius: 7px;
                        border: 1px solid transparent;
                        background: transparent;
                        color: #a99c86;
                      "
                    >
                      <svg
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.9"
                      >
                        <circle cx="12" cy="12" r="9"></circle>
                        <circle cx="12" cy="8" r="1.3" fill="currentColor"></circle>
                        <circle cx="8.5" cy="12.5" r="1.3" fill="currentColor"></circle>
                        <circle cx="15.5" cy="12.5" r="1.3" fill="currentColor"></circle>
                        <circle cx="12" cy="16" r="1.3" fill="currentColor"></circle>
                      </svg>
                    </button>
                    <sc-if value="{{ themeOpen }}" hint-placeholder-val="{{ false }}">
                      <div
                        style="
                          position: absolute;
                          right: 0;
                          bottom: calc(100% + 8px);
                          width: 172px;
                          background: #221b14;
                          border: 1px solid rgba(240, 225, 200, 0.15);
                          border-radius: 10px;
                          padding: 5px;
                          z-index: 10;
                          box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
                        "
                      >
                        <sc-for list="{{ themes }}" as="t" hint-placeholder-count="8">
                          <div
                            onClick="{{ t.pick }}"
                            style="
                              position: relative;
                              display: flex;
                              align-items: center;
                              gap: 9px;
                              padding: 7px 9px;
                              border-radius: 6px;
                              font-size: 13px;
                              font-weight: 600;
                              cursor: pointer;
                              color: #f3e9d8;
                            "
                          >
                            <sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"
                              ><span
                                style="
                                  position: absolute;
                                  inset: 0;
                                  border-radius: 6px;
                                  background: rgba(227, 189, 135, 0.13);
                                "
                              ></span
                            ></sc-if>
                            <svg
                              width="14"
                              height="14"
                              viewBox="0 0 14 14"
                              style="position: relative; flex: 0 0 auto"
                            >
                              <circle cx="7" cy="7" r="7" fill="{{ t.color }}"></circle>
                            </svg>
                            <span style="position: relative">{{ t.name }}</span>
                          </div>
                        </sc-for>
                      </div>
                    </sc-if>
                  </div>

                  <button
                    title="Contrast"
                    onClick="{{ toggleContrast }}"
                    style="
                      width: 30px;
                      height: 30px;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      border-radius: 7px;
                      border: 1px solid transparent;
                      background: transparent;
                      color: #a99c86;
                    "
                  >
                    <svg
                      width="15"
                      height="15"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.9"
                    >
                      <circle cx="12" cy="12" r="9"></circle>
                      <path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"appTitle":{"editor":"text","default":"BitButler","tsType":"string"},"tagline":{"editor":"text","default":"qBittorrent-nox Remote Client","tsType":"string"}}'
    >
      const THEMES=[
      {name:'BitButler',color:'#e3bd87',ink:'#241a0f'},
      {name:'Aurora',color:'#8ab4f8',ink:'#101820'},
      {name:'Mint Green',color:'#7cd9a5',ink:'#0f2016'},
      {name:'Purple Haze',color:'#b48ce0',ink:'#1c1526'},
      {name:'Ocean Breeze',color:'#6ec3d9',ink:'#0e1f24'},
      {name:'Pumpkin Spice',color:'#e0975a',ink:'#241609'},
      {name:'Deep Sea',color:'#4a7fb5',ink:'#0d1620'},
      {name:'Crimson Ember',color:'#d9614f',ink:'#220b08'}
      ];
      const HOSTS=['threadripper','homeserver-nas','vps-relay'];
      class Component extends DCLogic {
        state={hostOpen:false,themeOpen:false,selectedHost:HOSTS[0],themeIdx:0};
        renderVals(){
          return {
            appTitle:this.props.appTitle||'BitButler',
            tagline:this.props.tagline||'qBittorrent-nox Remote Client',
            hostLabel:this.state.selectedHost,
            hostOpen:this.state.hostOpen,
            themeOpen:this.state.themeOpen,
            toggleHost:(e)=>{e.stopPropagation();this.setState(s=>({hostOpen:!s.hostOpen,themeOpen:false}));},
            toggleTheme:(e)=>{e.stopPropagation();this.setState(s=>({themeOpen:!s.themeOpen,hostOpen:false}));},
            toggleContrast:(e)=>{e.stopPropagation();},
            stop:(e)=>e.stopPropagation(),
            closeAll:()=>this.setState({hostOpen:false,themeOpen:false}),
            connect:(e)=>{e.stopPropagation();},
            manageServers:(e)=>{e.stopPropagation();},
            hosts:HOSTS.map(h=>({label:h,on:h===this.state.selectedHost,
              pick:(e)=>{e.stopPropagation();this.setState({selectedHost:h,hostOpen:false});}})),
            themes:THEMES.map((t,i)=>({name:t.name,color:t.color,on:i===this.state.themeIdx,
              pick:(e)=>{e.stopPropagation();this.setState({themeIdx:i,themeOpen:false});}}))
          };
        }
      }
    </script>
  </body>
</html>
