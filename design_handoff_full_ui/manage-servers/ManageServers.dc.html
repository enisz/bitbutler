<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <!-- @template name="Manage Servers" description="List, add, edit, and delete saved server connections" -->
      <helmet>
        <script src="./ds-base.js"></script>
        <style>
          html,
          body {
            margin: 0;
            padding: 0;
            background: #100c08;
          }
          * {
            box-sizing: border-box;
          }
          button {
            font: inherit;
            cursor: pointer;
          }
          input {
            font: inherit;
          }
          ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
          }
          ::-webkit-scrollbar-thumb {
            background: rgba(240, 225, 200, 0.15);
            border-radius: 99px;
          }
        </style>
      </helmet>
      <div
        style="
          width: 100vw;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 32px;
          background: #100c08;
          font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
          color: #f3e9d8;
          font-size: 13.5px;
        "
      >
        <div
          style="
            width: 100%;
            max-width: 480px;
            background: #1c160f;
            border: 1px solid rgba(240, 225, 200, 0.15);
            border-radius: 18px;
            box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.75);
            overflow: hidden;
          "
        >
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 20px 22px;
              border-bottom: 1px solid rgba(240, 225, 200, 0.08);
            "
          >
            <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em">
              Manage Servers
            </div>
            <button
              style="
                width: 28px;
                height: 28px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                border: 1px solid rgba(240, 225, 200, 0.15);
                background: transparent;
                color: #a99c86;
              "
            >
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <path d="M6 6l12 12M18 6L6 18"></path>
              </svg>
            </button>
          </div>

          <div style="padding: 16px 22px 0">
            <input
              value="{{ filter }}"
              onInput="{{ onFilter }}"
              placeholder="Filter by name or host..."
              style="
                width: 100%;
                padding: 10px 12px;
                border-radius: 9px;
                border: 1px solid rgba(240, 225, 200, 0.15);
                background: #1f1912;
                color: #f3e9d8;
                font-size: 13.5px;
              "
            />
          </div>

          <div style="padding: 12px 22px 20px; display: flex; flex-direction: column; gap: 2px">
            <sc-for list="{{ servers }}" as="s" hint-placeholder-count="2">
              <div
                style="
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  gap: 12px;
                  padding: 11px 4px;
                  border-bottom: 1px solid rgba(240, 225, 200, 0.06);
                "
              >
                <div style="min-width: 0">
                  <div style="font-size: 14px; font-weight: 650">{{ s.name }}</div>
                  <div style="font-size: 12px; color: #7c705d; margin-top: 2px">{{ s.host }}</div>
                </div>
                <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
                  <sc-if value="{{ s.isDefault }}" hint-placeholder-val="{{ false }}">
                    <button
                      onClick="{{ s.toggleDefault }}"
                      title="Default"
                      style="
                        width: 26px;
                        height: 26px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        border-radius: 7px;
                        border: 1px solid rgba(240, 225, 200, 0.15);
                        background: rgba(227, 189, 135, 0.14);
                        color: #e3bd87;
                      "
                    >
                      <svg
                        width="13"
                        height="13"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.4"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M20 6L9 17l-5-5"></path>
                      </svg>
                    </button>
                  </sc-if>
                  <sc-if value="{{ s.isNotDefault }}" hint-placeholder-val="{{ true }}">
                    <button
                      onClick="{{ s.toggleDefault }}"
                      title="Set as default"
                      style="
                        width: 26px;
                        height: 26px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        border-radius: 7px;
                        border: 1px solid rgba(240, 225, 200, 0.15);
                        background: transparent;
                        color: #7c705d;
                      "
                    ></button>
                  </sc-if>
                  <button
                    onClick="{{ s.edit }}"
                    title="Edit"
                    style="
                      width: 26px;
                      height: 26px;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      border-radius: 7px;
                      border: 1px solid transparent;
                      background: transparent;
                      color: #a99c86;
                    "
                  >
                    <svg
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M12 20h9"></path>
                      <path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path>
                    </svg>
                  </button>
                  <button
                    onClick="{{ s.remove }}"
                    title="Delete"
                    style="
                      width: 26px;
                      height: 26px;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      border-radius: 7px;
                      border: 1px solid transparent;
                      background: transparent;
                      color: #d67866;
                    "
                  >
                    <svg
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M3 6h18"></path>
                      <path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
                      <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </sc-for>
            <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
              <div style="padding: 24px 4px; text-align: center; color: #7c705d; font-size: 13px">
                No servers match "{{ filter }}"
              </div>
            </sc-if>
          </div>

          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 14px 22px;
              border-top: 1px solid rgba(240, 225, 200, 0.08);
            "
          >
            <button
              onClick="{{ addServer }}"
              style="
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 9px 16px;
                border-radius: 8px;
                border: 1px solid #e3bd87;
                background: #e3bd87;
                color: #241a0f;
                font-size: 13.5px;
                font-weight: 700;
              "
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              >
                <path d="M12 5v14M5 12h14"></path></svg
              >Add Server
            </button>
            <button
              style="
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 9px 14px;
                border-radius: 8px;
                border: 1px solid transparent;
                background: transparent;
                color: #c9bda6;
                font-size: 13.5px;
                font-weight: 650;
                text-decoration: underline;
              "
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":640}}'>
      const DEFAULT_SERVERS=[
      {name:'qb5',host:'http://localhost:9020'},
      {name:'threadripper',host:'http://threadripper:8090'}
      ];
      class Component extends DCLogic {
        state={filter:'',defaultIdx:1,servers:DEFAULT_SERVERS};
        renderVals(){
          const filtered=this.state.servers.filter(s=>{
            const q=this.state.filter.toLowerCase();
            return !q||s.name.toLowerCase().includes(q)||s.host.toLowerCase().includes(q);
          });
          return {
            filter:this.state.filter,
            onFilter:(e)=>this.setState({filter:e.target.value}),
            noResults:filtered.length===0,
            addServer:()=>{},
            servers:filtered.map((s,i)=>{
              const idx=this.state.servers.indexOf(s);
              const isDefault=idx===this.state.defaultIdx;
              return {
                name:s.name,host:s.host,isDefault,isNotDefault:!isDefault,
                toggleDefault:()=>this.setState({defaultIdx:idx}),
                edit:()=>{},
                remove:()=>this.setState(st=>({servers:st.servers.filter((_,j)=>j!==idx)}))
              };
            })
          };
        }
      }
    </script>
  </body>
</html>
