<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <!-- @template name="Export Torrents" description="Export torrents to an archive file, with scope and save-location controls" -->
      <helmet>
        <script src="./ds-base.js"></script>
        <style>
          html,
          body {
            margin: 0;
            padding: 0;
            background: #100c08;
          }
          * {
            box-sizing: border-box;
          }
          input {
            font: inherit;
          }
          button {
            font: inherit;
            cursor: pointer;
          }
          ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
          }
          ::-webkit-scrollbar-thumb {
            background: rgba(240, 225, 200, 0.15);
            border-radius: 99px;
          }
        </style>
      </helmet>
      <div
        style="
          width: 100vw;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 32px;
          background: #100c08;
          font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
          color: #f3e9d8;
          font-size: 13.5px;
        "

        <div
          style="
            width: 100%;
            max-width: 760px;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            background: #1c160f;
            border: 1px solid rgba(240, 225, 200, 0.15);
            border-radius: 18px;
            box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.75);
            overflow: hidden;
          "

          <div

              flex: 0 0 auto;
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 20px 24px;
              border-bottom: 1px solid rgba(240, 225, 200, 0.08);

              Export Torrents
            </div>
            <button

                width: 30px;
                height: 30px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                border: 1px solid rgba(240, 225, 200, 0.15);
                background: transparent;
                color: #a99c86;
              "
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <path d="M6 6l12 12M18 6L6 18"></path>
              </svg>
            </button>
          </div>

          <div
            style="
              flex: 1 1 auto;
              min-height: 0;
              overflow-y: auto;
              padding: 22px 24px;
              display: flex;
              flex-direction: column;
              gap: 18px;
            "
          >
            <div
              style="
                border: 1px solid rgba(240, 225, 200, 0.1);
                border-radius: 12px;
                padding: 18px 20px;
              "

              <div style="font-size: 16px; font-weight: 700; margin-bottom: 14px">Connection</div>
              <div style="display: flex; flex-direction: column; gap: 11px">
                <div style="display: flex; align-items: center; justify-content: space-between">
                  <span style="color: #a99c86">Server</span
                  ><span style="font-weight: 600">{{ server }}</span>
                </div>
                <div style="display: flex; align-items: center; justify-content: space-between">
                  <span style="color: #a99c86">URL</span
                  ><span style="font-weight: 600">{{ url }}</span>
                </div>
                <div style="display: flex; align-items: center; justify-content: space-between">
                  <span style="color: #a99c86">WebUI version</span

                </div>
                <div style="display: flex; align-items: center; justify-content: space-between">
                  <span style="color: #a99c86">qBittorrent version</span

                </div>

                      display: flex;
                      align-items: center;
                      gap: 6px;
                      font-weight: 600;
                      color: #8fbf8a;

                      height="13"

                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.9"

                        cy="7.8"

                  </button></sc-if

              </div>

              <div style="font-size: 12px; color: #a99c86; margin-bottom: 7px">Categories</div>
              <div style="display: flex; gap: 8px; margin-bottom: 8px">
                <sc-if value="{{ cat1Active }}" hint-placeholder-val="{{ false }}"

                    "

                    <svg

                      viewBox="0 0 24 24"

                    >
                      <path
                        d="M9 6a3 3 0 016 0v3M6 20h12M6 20a2 2 0 01-2-2v-4a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2"
                      ></path></svg
                    >Assigned ({{ countCatAssigned }})
                  </button></sc-if
                >
                <sc-if value="{{ cat2Inactive }}" hint-placeholder-val="{{ true }}"
                  ><button
                    onClick="{{ setCat2 }}"
                    style="
                      flex: 1;

                      border: 1px solid rgba(240, 225, 200, 0.15);

                    "

                      ></path></svg

                  </button></sc-if
                >
              </div>
              <div style="font-size: 12px; color: #7c705d; margin-bottom: 16px">{{ catHelp }}</div>

              <div style="font-size: 12px; color: #a99c86; margin-bottom: 7px">Tags</div>
              <div style="display: flex; gap: 8px; margin-bottom: 8px">
                <sc-if value="{{ tag1Active }}" hint-placeholder-val="{{ false }}"
                  ><button
                    onClick="{{ setTag1 }}"
                    style="
                      flex: 1;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      gap: 8px;
                      padding: 10px;
                      border-radius: 8px;
                      border: 1px solid #e3bd87;
                      background: rgba(227, 189, 135, 0.14);
                      color: #e3bd87;
                      font-size: 13px;
                      font-weight: 650;
                    "
                  >
                    <svg
                      width="14"

                      stroke="currentColor"
                      stroke-width="1.9"

                      <path d="M20 12l-8 8-9-9V4h7z"></path>
                      <circle
                        cx="7.5"
                        cy="7.5"

                    <input
                      value="{{ directory }}"

                        flex: 1;
                        min-width: 0;
                        padding: 10px 12px;
                        border-radius: 8px;
                        border: 1px solid rgba(240, 225, 200, 0.15);
                        background: #1f1912;
                        color: #f3e9d8;
                        font-size: 13.5px;
                      "

                        font-weight: 650;

                        min-width: 0;
                        padding: 10px 12px;
                        border: 0;
                        outline: 0;
