<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <!-- @template name="New Connection" description="Form to add or edit a saved server connection" -->
      <helmet>
        <script src="./ds-base.js"></script>
        <style>
          html,
          body {
            margin: 0;
            padding: 0;
            background: #100c08;
          }
          * {
            box-sizing: border-box;
          }
          button {
            font: inherit;
            cursor: pointer;
          }
          input,
          select {
            font: inherit;
          }
          ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
          }
          ::-webkit-scrollbar-thumb {
            background: rgba(240, 225, 200, 0.15);
            border-radius: 99px;
          }
        </style>
      </helmet>
      <div
        style="
          width: 100vw;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 32px;
          background: #100c08;
          font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
          color: #f3e9d8;
          font-size: 13.5px;
        "
      >
        <div
          style="
            width: 100%;
            max-width: 520px;
            background: #1c160f;
            border: 1px solid rgba(240, 225, 200, 0.15);
            border-radius: 18px;
            box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.75);
            overflow: hidden;
          "
        >
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 20px 24px;
              border-bottom: 1px solid rgba(240, 225, 200, 0.08);
            "
          >
            <div style="font-size: 19px; font-weight: 750; letter-spacing: -0.01em">
              {{ title }}
            </div>
            <button
              style="
                width: 30px;
                height: 30px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                border: 1px solid rgba(240, 225, 200, 0.15);
                background: transparent;
                color: #a99c86;
              "
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <path d="M6 6l12 12M18 6L6 18"></path>
              </svg>
            </button>
          </div>

          <div style="padding: 22px 24px; display: flex; flex-direction: column; gap: 16px">
            <div>
              <div style="font-size: 11px; color: #7c705d; margin-bottom: 6px">Connection Name</div>
              <input
                value="{{ name }}"
                onInput="{{ onName }}"
                placeholder="e.g. threadripper"
                style="
                  width: 100%;
                  padding: 11px 13px;
                  border-radius: 9px;
                  border: 1px solid rgba(240, 225, 200, 0.15);
                  background: #1f1912;
                  color: #f3e9d8;
                  font-size: 14px;
                "
              />
            </div>

            <div style="display: grid; grid-template-columns: 110px 1fr 100px; gap: 12px">
              <div>
                <div style="font-size: 11px; color: #7c705d; margin-bottom: 6px">Protocol</div>
                <select
                  onChange="{{ onProtocol }}"
                  style="
                    width: 100%;
                    padding: 11px 10px;
                    border-radius: 9px;
                    border: 1px solid rgba(240, 225, 200, 0.15);
                    background: #1f1912;
                    color: #f3e9d8;
                    font-size: 14px;
                  "
                >
                  <option value="http" selected="{{ isHttp }}">http</option>
                  <option value="https" selected="{{ isHttps }}">https</option>
                </select>
              </div>
              <div>
                <div style="font-size: 11px; color: #7c705d; margin-bottom: 6px">Host</div>
                <input
                  value="{{ host }}"
                  onInput="{{ onHost }}"
                  placeholder="192.168.1.10"
                  style="
                    width: 100%;
                    padding: 11px 13px;
                    border-radius: 9px;
                    border: 1px solid rgba(240, 225, 200, 0.15);
                    background: #1f1912;
                    color: #f3e9d8;
                    font-size: 14px;
                  "
                />
              </div>
              <div>
                <div style="font-size: 11px; color: #7c705d; margin-bottom: 6px">Port</div>
                <input
                  value="{{ port }}"
                  onInput="{{ onPort }}"
                  style="
                    width: 100%;
                    padding: 11px 13px;
                    border-radius: 9px;
                    border: 1px solid rgba(240, 225, 200, 0.15);
                    background: #1f1912;
                    color: #f3e9d8;
                    font-size: 14px;
                  "
                />
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
              <div>
                <div style="font-size: 11px; color: #7c705d; margin-bottom: 6px">
                  Username (optional)
                </div>
                <input
                  value="{{ username }}"
                  onInput="{{ onUsername }}"
                  style="
                    width: 100%;
                    padding: 11px 13px;
                    border-radius: 9px;
                    border: 1px solid rgba(240, 225, 200, 0.15);
                    background: #1f1912;
                    color: #f3e9d8;
                    font-size: 14px;
                  "
                />
              </div>
              <div>
                <div style="font-size: 11px; color: #7c705d; margin-bottom: 6px">
                  Password (optional)
                </div>
                <input
                  type="password"
                  value="{{ password }}"
                  onInput="{{ onPassword }}"
                  style="
                    width: 100%;
                    padding: 11px 13px;
                    border-radius: 9px;
                    border: 1px solid rgba(240, 225, 200, 0.15);
                    background: #1f1912;
                    color: #f3e9d8;
                    font-size: 14px;
                  "
                />
              </div>
            </div>

            <div
              onClick="{{ toggleDefault }}"
              style="display: flex; align-items: center; gap: 10px; cursor: pointer"
            >
              <sc-if value="{{ isDefault }}" hint-placeholder-val="{{ false }}">
                <div
                  style="
                    width: 38px;
                    height: 22px;
                    border-radius: 999px;
                    background: #e3bd87;
                    border: 1px solid #e3bd87;
                    position: relative;
                    flex-shrink: 0;
                  "
                >
                  <div
                    style="
                      width: 16px;
                      height: 16px;
                      border-radius: 50%;
                      background: #241a0f;
                      position: absolute;
                      top: 2px;
                      left: 19px;
                      transition: 0.15s ease;
                    "
                  ></div>
                </div>
              </sc-if>
              <sc-if value="{{ isNotDefault }}" hint-placeholder-val="{{ true }}">
                <div
                  style="
                    width: 38px;
                    height: 22px;
                    border-radius: 999px;
                    background: #1f1912;
                    border: 1px solid rgba(240, 225, 200, 0.15);
                    position: relative;
                    flex-shrink: 0;
                  "
                >
                  <div
                    style="
                      width: 16px;
                      height: 16px;
                      border-radius: 50%;
                      background: #7c705d;
                      position: absolute;
                      top: 2px;
                      left: 2px;
                      transition: 0.15s ease;
                    "
                  ></div>
                </div>
              </sc-if>
              <span style="font-size: 13.5px">Set this connection as default</span>
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#7c705d"
                stroke-width="1.9"
              >
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 11v5.5"></path>
                <circle cx="12" cy="7.8" r="1" fill="#7c705d" stroke="none"></circle>
              </svg>
            </div>
          </div>

          <div
            style="
              display: flex;
              justify-content: flex-end;
              align-items: center;
              gap: 10px;
              padding: 16px 24px;
              border-top: 1px solid rgba(240, 225, 200, 0.08);
            "
          >
            <button
              style="
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 9px 18px;
                border-radius: 8px;
                border: 1px solid transparent;
                background: transparent;
                color: #c9bda6;
                font-size: 13.5px;
                font-weight: 650;
                text-decoration: underline;
              "
            >
              Cancel
            </button>
            <sc-if value="{{ canSave }}" hint-placeholder-val="{{ false }}"
              ><button
                onClick="{{ onSave }}"
                style="
                  display: inline-flex;
                  align-items: center;
                  gap: 8px;
                  padding: 10px 20px;
                  border-radius: 8px;
                  border: 1px solid #e3bd87;
                  background: #e3bd87;
                  color: #241a0f;
                  font-size: 13.5px;
                  font-weight: 700;
                "
              >
                Save
              </button></sc-if
            >
            <sc-if value="{{ canNotSave }}" hint-placeholder-val="{{ true }}"
              ><button
                style="
                  display: inline-flex;
                  align-items: center;
                  gap: 8px;
                  padding: 10px 20px;
                  border-radius: 8px;
                  border: 1px solid rgba(240, 225, 200, 0.15);
                  background: transparent;
                  color: #7c705d;
                  font-size: 13.5px;
                  font-weight: 700;
                "
              >
                Save
              </button></sc-if
            >
          </div>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":760,"height":640},"title":{"editor":"text","default":"New Connection","tsType":"string"}}'
    >
      class Component extends DCLogic {
        state={name:'',protocol:'http',host:'',port:'8080',username:'',password:'',isDefault:false};
        renderVals(){
          const p=this.props;
          const canSave=this.state.name.trim()!=='' && this.state.host.trim()!=='';
          return {
            title:p.title||'New Connection',
            name:this.state.name,onName:(e)=>this.setState({name:e.target.value}),
            isHttp:this.state.protocol==='http',isHttps:this.state.protocol==='https',
            onProtocol:(e)=>this.setState({protocol:e.target.value}),
            host:this.state.host,onHost:(e)=>this.setState({host:e.target.value}),
            port:this.state.port,onPort:(e)=>this.setState({port:e.target.value}),
            username:this.state.username,onUsername:(e)=>this.setState({username:e.target.value}),
            password:this.state.password,onPassword:(e)=>this.setState({password:e.target.value}),
            toggleDefault:()=>this.setState(s=>({isDefault:!s.isDefault})),
            isDefault:this.state.isDefault,isNotDefault:!this.state.isDefault,
            canSave,canNotSave:!canSave,
            onSave:()=>{}
          };
        }
      }
    </script>
  </body>
</html>
