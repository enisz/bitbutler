<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <!-- @template name="About" description="About / version info modal" -->
      <helmet>
        <script src="./ds-base.js"></script>
        <style>
          html,
          body {
            margin: 0;
            padding: 0;
            background: #16120e;
          }
          * {
            box-sizing: border-box;
          }
          button {
            font: inherit;
            cursor: pointer;
          }
          a {
            color: #e3bd87;
          }
        </style>
      </helmet>
      <div
        style="
          width: 100vw;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #16120e;
          font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
          padding: 32px;
        "
      >
        <div
          style="
            width: 100%;
            max-width: 460px;
            background: #1b1610;
            border: 1px solid rgba(240, 225, 200, 0.15);
            border-radius: 16px;
            box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.75);
            overflow: hidden;
          "
        >
          <div style="display: flex; gap: 16px; align-items: flex-start; padding: 22px 22px 20px">
            <img
              src="./logo.png"
              alt="logo"
              style="
                width: 60px;
                height: 60px;
                flex: 0 0 auto;
                border-radius: 50%;
                object-fit: cover;
              "
            />
            <div style="min-width: 0">
              <div
                style="font-size: 22px; font-weight: 750; letter-spacing: -0.01em; color: #f3e9d8"
              >
                {{ appName }}
              </div>
              <div
                style="
                  font-size: 11.5px;
                  font-weight: 650;
                  letter-spacing: 0.06em;
                  text-transform: uppercase;
                  color: #a99c86;
                  margin-top: 4px;
                "
              >
                {{ tagline }}
              </div>
              <div style="display: flex; gap: 8px; margin-top: 11px">
                <span
                  style="
                    padding: 4px 10px;
                    border-radius: 99px;
                    background: rgba(227, 189, 135, 0.14);
                    border: 1px solid rgba(227, 189, 135, 0.3);
                    color: #e3bd87;
                    font-size: 12px;
                    font-weight: 700;
                  "
                  >{{ version }}</span
                >
                <span
                  style="
                    padding: 4px 10px;
                    border-radius: 99px;
                    background: rgba(110, 195, 217, 0.14);
                    border: 1px solid rgba(110, 195, 217, 0.32);
                    color: #6ec3d9;
                    font-size: 12px;
                    font-weight: 700;
                  "
                  >{{ buildHash }}</span
                >
              </div>
            </div>
          </div>

          <div
            style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 22px 20px"
          >
            <div
              style="
                border: 1px solid rgba(240, 225, 200, 0.1);
                border-radius: 10px;
                padding: 12px 14px;
                background: #1f1912;
              "
            >
              <div
                style="
                  font-size: 10.5px;
                  font-weight: 700;
                  letter-spacing: 0.07em;
                  text-transform: uppercase;
                  color: #7c705d;
                "
              >
                Released
              </div>
              <div style="font-size: 13.5px; font-weight: 600; color: #f3e9d8; margin-top: 5px">
                {{ released }}
              </div>
            </div>
            <div
              style="
                border: 1px solid rgba(240, 225, 200, 0.1);
                border-radius: 10px;
                padding: 12px 14px;
                background: #1f1912;
              "
            >
              <div
                style="
                  font-size: 10.5px;
                  font-weight: 700;
                  letter-spacing: 0.07em;
                  text-transform: uppercase;
                  color: #7c705d;
                "
              >
                Platform
              </div>
              <div style="font-size: 13.5px; font-weight: 600; color: #f3e9d8; margin-top: 5px">
                {{ platform }}
              </div>
            </div>
          </div>

          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 10px;
              padding: 14px 22px;
              border-top: 1px solid rgba(240, 225, 200, 0.08);
            "
          >
            <div style="display: flex; gap: 8px; min-width: 0">
              <a
                href="{{ repoUrl }}"
                style="
                  display: inline-flex;
                  align-items: center;
                  gap: 7px;
                  padding: 7px 12px;
                  border-radius: 8px;
                  border: 1px dashed rgba(240, 225, 200, 0.25);
                  color: #c9bda6;
                  font-size: 12.5px;
                  font-weight: 600;
                  text-decoration: none;
                  white-space: nowrap;
                "
              >
                {{ repoLabel }}
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.5 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.36-3.37-1.36-.45-1.18-1.11-1.5-1.11-1.5-.9-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.72 0 0 .84-.28 2.75 1.05A9.3 9.3 0 0112 6.84c.85 0 1.71.12 2.51.35 1.9-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.46.1 2.72.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.79-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .28.18.61.69.5A10.26 10.26 0 0022 12.25C22 6.58 17.52 2 12 2z"
                  ></path>
                </svg>
              </a>
              <a
                href="{{ authorUrl }}"
                style="
                  display: inline-flex;
                  align-items: center;
                  gap: 7px;
                  padding: 7px 12px;
                  border-radius: 8px;
                  border: 1px dashed rgba(240, 225, 200, 0.25);
                  color: #c9bda6;
                  font-size: 12.5px;
                  font-weight: 600;
                  text-decoration: none;
                  white-space: nowrap;
                "
              >
                {{ authorLabel }}
                <svg
                  width="13"
                  height="13"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="8" r="3.4"></circle>
                  <path d="M4.5 20c1.4-3.6 4-5.4 7.5-5.4s6.1 1.8 7.5 5.4"></path>
                </svg>
              </a>
            </div>
            <button
              onClick="{{ onClose }}"
              style="
                flex: 0 0 auto;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 8px 15px;
                border-radius: 8px;
                border: 1px solid rgba(240, 225, 200, 0.2);
                background: transparent;
                color: #f3e9d8;
                font-size: 13px;
                font-weight: 650;
              "
            >
              Close
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <path d="M6 6l12 12M18 6L6 18"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"appName":{"editor":"text","default":"BitButler","tsType":"string"},"tagline":{"editor":"text","default":"The Digital Butler For Your Torrents","tsType":"string"},"version":{"editor":"text","default":"v1.2.0","tsType":"string"},"buildHash":{"editor":"text","default":"#e102502","tsType":"string"},"released":{"editor":"text","default":"2026-05-23 23:39","tsType":"string"},"platform":{"editor":"text","default":"Angular &amp; Electron","tsType":"string"},"repoLabel":{"editor":"text","default":"github@bitbutler","tsType":"string"},"authorLabel":{"editor":"text","default":"@enisz","tsType":"string"}}'
    >
      class Component extends DCLogic {
        renderVals(){
          return {
            appName:this.props.appName||'BitButler',
            tagline:this.props.tagline||'The Digital Butler For Your Torrents',
            version:this.props.version||'v1.2.0',
            buildHash:this.props.buildHash||'#e102502',
            released:this.props.released||'2026-05-23 23:39',
            platform:this.props.platform||'Angular & Electron',
            repoLabel:this.props.repoLabel||'github@bitbutler',
            repoUrl:this.props.repoUrl||'#',
            authorLabel:this.props.authorLabel||'@enisz',
            authorUrl:this.props.authorUrl||'#',
            onClose:(e)=>{e&&e.stopPropagation&&e.stopPropagation();}
          };
        }
      }
    </script>
  </body>
</html>
