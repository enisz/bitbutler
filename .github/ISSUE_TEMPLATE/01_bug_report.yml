name: 🪲 Bug Report
description: Report a reproducible bug
title: '[BUG]: '
labels: ['bug']
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How did you encounter the bug?
      placeholder: |
        1. Open BitButler
        2. Click on...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BitButler Version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
