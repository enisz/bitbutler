name: 📈 Enhancement
description: Suggest an improvement to an existing feature
title: '[ENHANCEMENT]: '
labels: ['enhancement']
body:
  - type: textarea
    id: description
    attributes:
      label: Current Behavior
      placeholder: How does the feature work right now?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Improvement
      placeholder: What change are you suggesting and why?
    validations:
      required: true
