name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: 'Version to release'
        options:
          - major
          - minor
          - patch
        default: 'patch'

run-name: 'Release ${{ inputs.version }} by @${{ github.actor }}'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-flight:
    name: '[1/8] Lint & Tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install -g npm@11
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
      - name: Angular unit tests
        run: npm run test --workspace=packages/app
      - name: Electron unit tests
        run: npm run test --workspace=packages/electron

  bump-version:
    name: '[2/8] Bump Version'
    runs-on: ubuntu-latest
    needs: [pre-flight]
    outputs:
      version: ${{ steps.bump.outputs.version }}
      raw_version: ${{ steps.bump.outputs.raw_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Bump version and write release metadata
        id: bump
        run: |
          NEW_VERSION=$(npm version ${{ github.event.inputs.version }} --no-git-tag-version)
          PLAIN_VERSION="${NEW_VERSION#v}"

          # packages/app/package.json is what the Angular build imports at compile time
          npm version "$PLAIN_VERSION" --workspace=packages/app --no-git-tag-version
          npm pkg set "release.commit"="$(git rev-parse HEAD)" --workspace=packages/app
          npm pkg set "release.date"="$(date +%s)" --workspace=packages/app

          echo "version=$PLAIN_VERSION" >> $GITHUB_OUTPUT
          echo "raw_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Upload versioned package files
        uses: actions/upload-artifact@v7
        with:
          name: versioned-packages
          # electron-builder reads root package.json for the app version
          # Angular reads packages/app/package.json for version + release metadata
          path: |
            package.json
            packages/app/package.json
          retention-days: 1

  build-app:
    name: '[3/8] Build Angular App'
    runs-on: ubuntu-latest
    needs: [bump-version]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install -g npm@11
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Apply bumped package versions
        uses: actions/download-artifact@v8
        with:
          name: versioned-packages

      - run: npm run build:ui

      - name: Upload Angular build
        uses: actions/upload-artifact@v7
        with:
          name: angular-dist
          path: dist/
          retention-days: 1

  electron-pack:
    name: '[4/8] Package Electron (${{ matrix.job_name }})'
    runs-on: ${{ matrix.os }}
    needs: [bump-version, build-app]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: --linux
            job_name: 'Linux'
          - os: windows-latest
            target: --win
            job_name: 'Windows'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install -g npm@11
      - run: npm ci
        env:
          ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'

      - name: Install Linux Build Dependencies (RPM)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Apply bumped package versions
        uses: actions/download-artifact@v8
        with:
          name: versioned-packages

      - name: Download Angular build
        uses: actions/download-artifact@v8
        with:
          name: angular-dist
          path: dist/

      - name: Compile Electron TypeScript
        run: npm run build:electron

      - name: Package Electron app
        run: npx electron-builder ${{ matrix.target }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-dist-${{ matrix.os }}
          path: dist-electron/
          retention-days: 1

  e2e-no-server:
    name: '[5/8] E2E Tests - No Server (Playwright / Electron)'
    runs-on: ubuntu-latest
    needs: [pre-flight]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install -g npm@11
      - run: npm ci
        env:
          ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'

      - name: Install display and system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 \
            libxss1 libxkbcommon0 libatk-bridge2.0-0 libcups2 libdrm2

      - name: Build Angular app
        run: npm run build

      - name: Build Electron TypeScript
        run: npm run build:electron

      - name: Run Playwright e2e tests
        run: npm run test:e2e:ci

  e2e-server:
    name: '[6/8] E2E Tests - Server (Playwright / Electron / qBittorrent)'
    runs-on: ubuntu-latest
    needs: [pre-flight, e2e-no-server]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install -g npm@11
      - run: npm ci
        env:
          ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'

      - name: Install display and system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 \
            libxss1 libxkbcommon0 libatk-bridge2.0-0 libcups2 libdrm2

      - name: Build Angular app
        run: npm run build

      - name: Build Electron TypeScript
        run: npm run build:electron

      - name: Run Playwright e2e server tests
        run: npm run test:e2e:server:ci

  commit-and-tag:
    name: '[7/8] Commit & Tag'
    runs-on: ubuntu-latest
    needs: [bump-version, build-app, electron-pack, e2e-no-server, e2e-server]
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Apply bumped package versions
        uses: actions/download-artifact@v8
        with:
          name: versioned-packages

      - name: Commit and tag
        id: commit
        run: |
          RAW="${{ needs.bump-version.outputs.raw_version }}"
          git add package.json packages/app/package.json
          git commit -m "Release $RAW"
          git tag "$RAW"
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Push
        run: git push origin main --tags

  publish-release:
    name: '[8/8] Publish Release'
    runs-on: ubuntu-latest
    needs: [bump-version, commit-and-tag]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: electron-dist-ubuntu-latest
          path: dist-electron/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: electron-dist-windows-latest
          path: dist-electron/

      - name: Draft release notes
        uses: release-drafter/release-drafter@v7
        with:
          tag: ${{ needs.bump-version.outputs.raw_version }}
          name: BitButler ${{ needs.bump-version.outputs.raw_version }}
          version: ${{ needs.bump-version.outputs.raw_version }}
          publish: false
          prerelease: false
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.bump-version.outputs.raw_version }}
          files: |
            dist-electron/*.exe
            dist-electron/*.zip
            dist-electron/*.deb
            dist-electron/*.AppImage
            dist-electron/*.rpm
            dist-electron/*.snap
            dist-electron/*.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ needs.bump-version.outputs.raw_version }} --draft=false
