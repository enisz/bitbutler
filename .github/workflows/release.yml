name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: 'Version to release'
        options:
          - major
          - minor
          - patch
        default: 'patch'

run-name: 'Release ${{ inputs.version }} by @${{ github.actor }}'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-flight:
    name: '[1/7] Lint & Tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
      - name: Angular unit tests
        run: npm run test --workspace=packages/app
      - name: Electron unit tests
        run: npm run test --workspace=packages/electron
      - name: Docs unit tests
        run: npm run test --workspace=packages/docs

  bump-version:
    name: '[2/7] Bump Version'
    runs-on: ubuntu-latest
    needs: [pre-flight]
    outputs:
      version: ${{ steps.bump.outputs.version }}
      raw_version: ${{ steps.bump.outputs.raw_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump version and write release metadata
        id: bump
        run: |
          NEW_VERSION=$(npm version ${{ github.event.inputs.version }} --no-git-tag-version)
          PLAIN_VERSION="${NEW_VERSION#v}"

          # packages/app/package.json is what the Angular build imports at compile time
          npm version "$PLAIN_VERSION" --workspace=packages/app --no-git-tag-version
          npm pkg set "release.commit"="$(git rev-parse HEAD)" --workspace=packages/app
          npm pkg set "release.date"="$(date +%s)" --workspace=packages/app

          echo "version=$PLAIN_VERSION" >> $GITHUB_OUTPUT
          echo "raw_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Upload versioned package files
        uses: actions/upload-artifact@v4
        with:
          name: versioned-packages
          # electron-builder reads root package.json for the app version
          # Angular reads packages/app/package.json for version + release metadata
          path: |
            package.json
            packages/app/package.json
          retention-days: 1

  check-docs:
    name: '[2/7] Check Docs Changes'
    runs-on: ubuntu-latest
    needs: [pre-flight]
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs changes since last release tag
        id: check
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --quiet "$PREV_TAG"..HEAD -- packages/docs/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No docs changes since $PREV_TAG — skipping docs build"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  build-app:
    name: '[3/7] Build Angular App'
    runs-on: ubuntu-latest
    needs: [bump-version]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Apply bumped package versions
        uses: actions/download-artifact@v4
        with:
          name: versioned-packages

      - run: npm run build:ui

      - name: Upload Angular build
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/
          retention-days: 1

  build-docs:
    name: '[3/7] Build Docs'
    runs-on: ubuntu-latest
    needs: [bump-version, check-docs]
    if: needs.check-docs.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run docs:build
        env:
          VITE_BASE_HREF: /bitbutler/
      - name: Upload docs build
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: packages/docs/dist/
          retention-days: 1

  electron-pack:
    name: '[4/7] Package Electron (${{ matrix.job_name }})'
    runs-on: ${{ matrix.os }}
    needs: [bump-version, build-app]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: --linux
            job_name: 'Linux'
          - os: windows-latest
            target: --win
            job_name: 'Windows'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Install Linux Build Dependencies (RPM)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Apply bumped package versions
        uses: actions/download-artifact@v4
        with:
          name: versioned-packages

      - name: Download Angular build
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: dist/

      - name: Package Electron app
        run: npx electron-builder ${{ matrix.target }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-dist-${{ matrix.os }}
          path: dist-electron/
          retention-days: 1

  commit-and-tag:
    name: '[5/7] Commit & Tag'
    runs-on: ubuntu-latest
    needs: [bump-version, build-app, build-docs, electron-pack]
    # build-docs may be skipped when docs have no changes — that is not a failure
    if: |
      always() &&
      needs.bump-version.result == 'success' &&
      needs.build-app.result == 'success' &&
      needs.electron-pack.result == 'success' &&
      (needs.build-docs.result == 'success' || needs.build-docs.result == 'skipped')
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Apply bumped package versions
        uses: actions/download-artifact@v4
        with:
          name: versioned-packages

      - name: Commit and tag
        id: commit
        run: |
          RAW="${{ needs.bump-version.outputs.raw_version }}"
          git add package.json packages/app/package.json
          git commit -m "Release $RAW"
          git tag "$RAW"
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Push
        run: git push origin main --tags

  publish-release:
    name: '[6/7] Publish Release'
    runs-on: ubuntu-latest
    needs: [bump-version, commit-and-tag]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: electron-dist-ubuntu-latest
          path: dist-electron/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: electron-dist-windows-latest
          path: dist-electron/

      - name: Draft release notes
        uses: release-drafter/release-drafter@v5
        with:
          tag: ${{ needs.bump-version.outputs.raw_version }}
          name: BitButler ${{ needs.bump-version.outputs.raw_version }}
          version: ${{ needs.bump-version.outputs.raw_version }}
          publish: false
          prerelease: false
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.raw_version }}
          files: |
            dist-electron/*.exe
            dist-electron/*.zip
            dist-electron/*.deb
            dist-electron/*.AppImage
            dist-electron/*.rpm
            dist-electron/*.snap
            dist-electron/*.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ needs.bump-version.outputs.raw_version }} --draft=false

  deploy-docs:
    name: '[7/7] Deploy Docs'
    runs-on: ubuntu-latest
    needs: [publish-release, build-docs]
    if: needs.build-docs.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download pre-built docs
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: docs-dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-dist/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
