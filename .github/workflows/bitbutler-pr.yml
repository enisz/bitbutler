name: BitButler PR Verification
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce-rules:
    name: '[1/4] PR Format & Issue Sync'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
    steps:
      - name: Sync Issue Details
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";

            const issueRegex = /(?:Fixes\s+)?#([0-9]+)/i;
            const match = body.match(issueRegex);

            if (!match) {
              core.setFailed("ERROR: Every PR must link to an Issue (e.g., 'Fixes #123') in the description.");
              return;
            }

            const issueNumber = parseInt(match[1]);
            const { owner, repo } = context.repo;

            try {
              const { data: issue } = await github.rest.issues.get({
                owner, repo, issue_number: issueNumber
              });

              const labels = issue.labels.map(l => l.name);
              if (labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner, repo,
                  issue_number: pr.number,
                  labels: labels
                });
                console.log(`Synced labels: ${labels.join(', ')}`);
              }
            } catch (error) {
              core.setFailed(`Error processing Issue #${issueNumber}: ${error.message}`);
            }

  lint:
    name: '[2/4] Code Quality (Lint)'
    runs-on: ubuntu-latest
    needs: [enforce-rules]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint

  test-app:
    name: '[3/4] Angular Unit Tests'
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run test --workspace=packages/app

  test-electron:
    name: '[3/4] Electron Unit Tests'
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run test --workspace=packages/electron

  test-docs:
    name: '[3/4] Docs Unit Tests'
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run test --workspace=packages/docs

  build:
    name: '[4/4] Build & Package (${{ matrix.job_name }})'
    runs-on: ${{ matrix.os }}
    needs: [test-app, test-electron, test-docs]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: --linux
            job_name: 'Linux'
          - os: windows-latest
            target: --win
            job_name: 'Windows'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Install Linux Build Dependencies (RPM)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - run: npm run build:ui
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build Electron App
        run: npx electron-builder ${{ matrix.target }}
