name: BitButler PR Verification
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce-rules:
    name: '[1/7] PR Format & Issue Sync'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
    steps:
      - name: Sync Issue Details
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";

            const issueRegex = /(?:Fixes\s+)?#([0-9]+)/i;
            const match = body.match(issueRegex);

            if (!match) {
              core.setFailed("ERROR: Every PR must link to an Issue (e.g., 'Fixes #123') in the description.");
              return;
            }

            const issueNumber = parseInt(match[1]);
            const { owner, repo } = context.repo;

            try {
              const { data: issue } = await github.rest.issues.get({
                owner, repo, issue_number: issueNumber
              });

              const labels = issue.labels.map(l => l.name);
              if (labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner, repo,
                  issue_number: pr.number,
                  labels: labels
                });
                console.log(`Synced labels: ${labels.join(', ')}`);
              }
            } catch (error) {
              core.setFailed(`Error processing Issue #${issueNumber}: ${error.message}`);
            }

  detect-changes:
    name: '[2/7] Detect Changes'
    runs-on: ubuntu-latest
    needs: [enforce-rules]
    outputs:
      app: ${{ steps.filter.outputs.app }}
      electron: ${{ steps.filter.outputs.electron }}
      any-source: ${{ steps.filter.outputs.any-source }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'packages/app/**'
              - 'packages/shared/**'
              - 'public/**'
            electron:
              - 'packages/electron/**'
              - 'packages/shared/**'
              - 'public/**'
            any-source:
              - 'packages/**'
              - 'public/**'
              - '.eslint*'
              - 'tsconfig*'
              - 'package.json'
              - 'package-lock.json'

  lint:
    name: '[3/7] Code Quality (Lint)'
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.any-source == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install -g npm@11
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint

  test-app:
    name: '[4/7] Unit Tests - Angular'
    runs-on: ubuntu-latest
    needs: [detect-changes, lint]
    if: always() && needs.detect-changes.outputs.app == 'true' && needs.lint.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install -g npm@11
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run test --workspace=packages/app

  test-electron:
    name: '[4/7] Unit Tests - Electron'
    runs-on: ubuntu-latest
    needs: [detect-changes, lint]
    if: always() && needs.detect-changes.outputs.electron == 'true' && needs.lint.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install -g npm@11
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run test --workspace=packages/electron

  e2e-no-server:
    name: '[5/7] E2E Tests - No Server (Playwright / Electron)'
    runs-on: ubuntu-latest
    needs: [detect-changes, test-app, test-electron]
    if: >-
      always() &&
      needs.detect-changes.outputs.any-source == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    env:
      ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install -g npm@11
      - run: npm ci

      - name: Install display and Chromium system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 libxss1 libxkbcommon0 libatk-bridge2.0-0 libcups2 libdrm2

      - name: Build Angular app
        run: npm run build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build Electron TypeScript
        run: npm run build:electron

      - name: Run Playwright e2e tests
        run: npm run test:e2e:ci

  e2e-server:
    name: '[6/7] E2E Tests - Server (Playwright / Electron / qBittorrent)'
    runs-on: ubuntu-latest
    needs: [detect-changes, test-app, test-electron, e2e-no-server]
    if: >-
      always() &&
      needs.detect-changes.outputs.any-source == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    env:
      ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install -g npm@11
      - run: npm ci
      - name: Install display and system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 \
            libxss1 libxkbcommon0 libatk-bridge2.0-0 libcups2 libdrm2
      - name: Build Angular app
        run: npm run build
      - name: Build Electron TypeScript
        run: npm run build:electron
      - name: Run Playwright e2e server tests
        run: npm run test:e2e:server:ci

  build:
    name: '[7/7] Build & Package (${{ matrix.job_name }})'
    runs-on: ${{ matrix.os }}
    needs: [detect-changes, test-app, test-electron, e2e-no-server, e2e-server]
    if: >-
      always() &&
      (needs.detect-changes.outputs.app == 'true' || needs.detect-changes.outputs.electron == 'true') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    env:
      ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: --linux
            job_name: 'Linux'
          - os: windows-latest
            target: --win
            job_name: 'Windows'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install -g npm@11
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install Linux Build Dependencies (RPM)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - run: npm run build:ui

      - name: Compile Electron TypeScript
        run: npm run build:electron

      - name: Build Electron App
        run: npx electron-builder ${{ matrix.target }}
