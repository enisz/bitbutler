name-template: 'BitButler v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

branches:
  - main
disable-autolabeler: true

version-resolver:
  major:
    labels: ['major']
  minor:
    labels: ['minor']
  patch:
    labels: ['patch']
  default: patch

categories:
  - title: '🚀 Features'
    labels: ['feature']
  - title: '📈 Enhancements'
    labels: ['enhancement']
  - title: '🪲 Bug Fixes'
    labels: ['bug']
  - title: '🧰 Maintenance'
    labels: ['maintenance']
  - title: '📦 Other Changes'
    labels: []

change-template: '- [#$NUMBER](https://github.com/enisz/bitbutler/pull/$NUMBER): $TITLE'

template: |
  ## What's Changed

  $CHANGES
