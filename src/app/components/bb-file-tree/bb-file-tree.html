<div class="bb-tree-header">
  <div class="bb-tree-stats">
    <div class="bb-stat-item">
      <strong>{{ totalFolders }}</strong> folders
    </div>
    <span class="bb-stat-divider">|</span>
    <div class="bb-stat-item">
      <strong>{{ downloadCount }}</strong> of {{ totalFiles }} files
    </div>
  </div>
  <div class="bb-tree-total-size ms-auto">
    <strong>{{ selectedSize | fileSize }}</strong> / {{ totalSize | fileSize }}
  </div>
  <div class="button-bar ms-2" *ngIf="allowEdit">
    <button
      *ngIf="!editMode()"
      type="button"
      class="btn btn-sm btn-link text-secondary"
      [ngbTooltip]="'components.bb-file-tree.button.edit' | translate"
      tooltipClass="single-line-tooltip"
      placement="top"
      (click)="enterEditMode()"
    >
      <fa-icon [icon]="icon.faEdit"></fa-icon>
    </button>

    <button
      *ngIf="editMode()"
      type="button"
      class="btn btn-sm btn-link text-success"
      [ngbTooltip]="'components.bb-file-tree.button.save' | translate"
      tooltipClass="single-line-tooltip"
      placement="top"
      (click)="saveEdit()"
    >
      <fa-icon [icon]="icon.faCheck"></fa-icon>
    </button>

    <button
      *ngIf="editMode()"
      type="button"
      class="btn btn-sm btn-link text-danger"
      [ngbTooltip]="'components.bb-file-tree.button.cancel' | translate"
      tooltipClass="single-line-tooltip"
      placement="top"
      (click)="cancelEdit()"
    >
      <fa-icon [icon]="icon.faX"></fa-icon>
    </button>
  </div>
</div>

<cdk-tree
  [dataSource]="data"
  [treeControl]="treeControl"
  [trackBy]="trackByPath"
  class="bb-file-tree"
>
  <cdk-nested-tree-node *cdkTreeNodeDef="let node; when: hasChild" class="bb-node">
    <div
      class="bb-row bb-row--dir"
      [class.bb-row--skipped]="isFolderEmpty(node)"
      (click)="toggle(node)"
    >
      <button type="button" class="bb-toggle" (click)="$event.stopPropagation(); toggle(node)">
        <span class="bb-caret" [class.bb-caret--open]="isExpanded(node)"></span>
      </button>

      <input
        *ngIf="editMode()"
        type="checkbox"
        class="bb-checkbox"
        [checked]="isFolderSelected(node)"
        [indeterminate]="isFolderIndeterminate(node)"
        (click)="$event.stopPropagation()"
        (change)="toggleFolderSelection(node, $event)"
      />

      <span class="bb-icon">📁</span>

      <span *ngIf="!editMode()" class="bb-name">{{ node.name }}</span>
      <input
        *ngIf="editMode()"
        class="bb-input"
        [(ngModel)]="node.name"
        (click)="$event.stopPropagation()"
        (change)="onFolderNameChange(node)"
      />

      <div class="bb-meta" *ngIf="editMode()">
        <select
          class="bb-select"
          (click)="$event.stopPropagation()"
          (change)="setFolderPriority(node, +$any($event.target).value)"
        >
          <option value="" disabled selected>Set Priority...</option>
          <option *ngFor="let opt of priorityOptions" [value]="opt.value">{{ opt.label }}</option>
        </select>
      </div>
    </div>

    <div class="bb-children" [class.bb-children--open]="isExpanded(node)">
      <ng-container cdkTreeNodeOutlet></ng-container>
    </div>
  </cdk-nested-tree-node>

  <cdk-tree-node *cdkTreeNodeDef="let node" class="bb-node">
    <div class="bb-row bb-row--file" [class.bb-row--skipped]="node.file?.priority === 0">
      <span class="bb-spacer"></span>

      <input
        *ngIf="editMode() && node.file as f"
        type="checkbox"
        class="bb-checkbox"
        [checked]="f.priority !== 0"
        (change)="toggleFileSelection(f, $event)"
      />

      <span class="bb-icon">📄</span>

      <span
        *ngIf="!editMode()"
        class="bb-name"
        [ngbTooltip]="node.name"
        tooltipClass="single-line-tooltip"
        placement="right"
        [openDelay]="500"
        >{{ node.name }}</span
      >
      <input
        *ngIf="editMode()"
        class="bb-input"
        [(ngModel)]="node.name"
        (change)="onFileNameChange(node)"
      />

      <ng-container *ngIf="showMeta && node.file as f">
        <div class="bb-meta">
          <span class="bb-size">{{ f.length | fileSize }}</span>

          <ng-container *ngIf="!editMode()">
            <app-bb-progress
              [progress]="f.progress"
              variant="secondary"
              style="width: 100px"
            ></app-bb-progress>
            <span class="bb-pill" *ngIf="f.priority !== 0">{{
              f.priority === 7 ? 'Max' : f.priority === 6 ? 'High' : 'Normal'
            }}</span>
          </ng-container>

          <ng-container *ngIf="editMode()">
            <select
              *ngIf="f.priority !== 0"
              class="bb-select"
              [(ngModel)]="f.priority"
              (change)="calculateStats()"
            >
              <option *ngFor="let opt of priorityOptions" [value]="opt.value">
                {{ opt.label }}
              </option>
            </select>
            <span *ngIf="f.priority === 0" class="bb-skipped-label">Skipped</span>
          </ng-container>
        </div>
      </ng-container>
    </div>
  </cdk-tree-node>
</cdk-tree>
