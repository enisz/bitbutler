<div class="modal-header bb-modal-header">
  <div class="bb-modal-header__text">
    <h5 class="modal-title bb-title-clamp">{{ 'pages.settings.title' | translate }}</h5>

    <ul class="nav nav-tabs bb-modal-tabs">
      @for (tab of tabs; track tab.id) {
        <li class="nav-item">
          <button
            class="nav-link"
            [class.active]="activeTabId() === tab.id"
            (click)="selectTab(tab.id)"
          >
            {{ tab.label | translate }}
          </button>
        </li>
      }
    </ul>
  </div>

  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body">
  @if (loadedComponent()) {
    <ng-container *ngComponentOutlet="loadedComponent()"></ng-container>
  } @else {
    <app-bb-spinner></app-bb-spinner>
  }
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-link" (click)="activeModal.close()" autofocus>
    {{ 'general.button.close' | translate }}
  </button>
</div>
